server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Ready only when the deployed entrypoint is present.
    location = /health {
        access_log off;
        add_header Cache-Control "no-store";
        try_files /index.html =503;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Vite fingerprints these files; missing assets must never return SPA HTML.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~ /\. {
        return 404;
    }

    # Reserved backend paths must never become an HTML SPA fallback.
    location ~ ^/(api|internal|admin)(/|$) {
        return 404;
    }
    location ~* \.php(?:/|$) {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
