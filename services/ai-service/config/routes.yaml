# Маршруты задач к моделям (ТЗ §5.1). Провайдер, модель и режим — конфиг, не код.
#
# Провайдеры — только через шлюз ИИ (docs/tasks/ai/gateway/): ключи провайдеров живут на
# шлюзе, сервис предъявляет один токен шлюза AI_GATEWAY_TOKEN. При заданном
# AI_SERVICE_LLM_GATEWAY_URL сервис не стартует, если base_url провайдера мимо шлюза.
# Провайдер без токена в env выключен: fallback его пропускает, single — задача уходит в повтор.
#
# Режимы: single — одна модель; fallback — при ошибке или таймауте следующая;
# vote — с первой задачей высокого риска (пока конфиг с ним не загружается).

providers:
  stub:
    type: stub
  openai:
    type: openai_compatible
    base_url: https://ai.vashfindir.ru/openai/v1
    api_key_env: AI_GATEWAY_TOKEN
  deepseek:
    type: openai_compatible
    base_url: https://ai.vashfindir.ru/deepseek/v1
    api_key_env: AI_GATEWAY_TOKEN
    # deepseek-flash по умолчанию «размышляет»: +54% токенов ответа и +1 с на пачку при той
    # же точности на синтетике (docs/tasks/ai/gateway/g3.md).
    extra_body:
      thinking: {type: disabled}
  kimi:
    # В маршруты — после ключа на шлюзе (#2837): с общим токеном шлюз ответил бы 503.
    type: openai_compatible
    base_url: https://ai.vashfindir.ru/kimi/v1
    api_key_env: AI_GATEWAY_TOKEN

tasks:
  # Диагностика пути Symfony → сервис → Symfony, без сети.
  echo:
    mode: single
    models: [stub/echo]

  # Подсказка статьи ДДС (этап 2). Порядок — по evals-compare на синтетике (G3, g3.md): точность
  # равная, DeepSeek быстрее и дешевле. deepseek-chat DeepSeek выводит — имя deepseek-flash.
  # Локально — config/routes.dev.yaml.
  categorize_transactions:
    mode: fallback
    models: [deepseek/deepseek-flash, openai/gpt-4.1-mini]
