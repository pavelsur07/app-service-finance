[project]
name = "ai-service"
version = "0.1.0"
description = "ИИ-сервис Ваш Финдир: задачи для Symfony через pipeline с проверками"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=2.3,<3",
    "fastapi>=0.162,<1",
    "httpx>=0.28,<1",
    "psycopg[binary]>=3.3,<4",
    "psycopg-pool>=3.3,<4",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.16,<3",
    "pyyaml>=6.0,<7",
    "structlog>=26.1,<27",
    "uvicorn>=0.54,<1",
]

[dependency-groups]
dev = [
    "jsonschema>=4.26,<5",
    "mypy>=2.4,<3",
    "pytest>=9.2,<10",
    "ruff>=0.17,<0.18",
    "types-pyyaml>=6.0.12",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_service"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "BLE", "SIM", "RUF", "PT", "N", "C4", "DTZ", "T20"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
packages = ["ai_service"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["jsonschema.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: нужен PostgreSQL (AI_TEST_DB_DSN)",
    "evals: прогон eval-набора задач",
]
addopts = "-ra --strict-markers"
