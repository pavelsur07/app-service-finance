<!-- @react AppShell -->
<!-- @uiKit v2.4 -->
<!-- @docs ui-kit/patterns/app-shell.css -->

<!--
  AppShell — каркас всех страниц приложения.
  Структура: .app (колонка) → .app-header + .app-body(.app-sidebar + .app-workzone).
  Компонует существующие .app-header (component) + .sb (pattern), ничего в них не меняя;
  контент страницы вкладывается в .app-workzone.
  Sidebar sticky от top: var(--app-header-height); workzone — flex:1, padding s-6 / s-7.
-->

        <div class="demo" style="padding:0; display:block; background:var(--bg-page);">
          <!-- Уменьшенное превью каркаса: min-height задан inline, чтобы не растягиваться на 100vh внутри storybook -->
          <div class="app" style="min-height:0; height:420px; overflow:hidden;">
            <header class="app-header">
              <div class="app-header-brand">
                <div style="display:flex; align-items:center; gap:8px;">
                  <div class="nav-logo" style="width:30px; height:30px;">ВФ</div>
                  <span style="font-weight:800; font-size:14px; letter-spacing:-0.01em;">Ваш Финдир</span>
                </div>
              </div>
              <div class="app-header-body">
                <nav class="crumbs">
                  <a href="#app-shell">Главная</a>
                  <span class="crumb-sep"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg></span>
                  <span class="crumb-current">Дашборд</span>
                </nav>
                <div class="u-flex-1"></div>
                <div class="app-header-actions">
                  <button class="h-btn h-btn--icon" title="Уведомления">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                    <span class="dot"></span>
                  </button>
                </div>
              </div>
            </header>
            <div class="app-body">
              <aside class="app-sidebar">
                <div class="sb">
                  <div class="sb-nav">
                    <div class="sb-group-title">Главное</div>
                    <a class="sb-item is-active" href="#app-shell">
                      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 12L12 4l9 8"></path><path d="M5 10v10h14V10"></path></svg>
                      <span class="lbl">Дашборд</span>
                    </a>
                    <a class="sb-item" href="#app-shell">
                      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="18" height="13" rx="2"></rect><path d="M3 10h18"></path></svg>
                      <span class="lbl">Движение ДС</span>
                      <span class="badge">248</span>
                    </a>
                    <a class="sb-item" href="#app-shell">
                      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 3v18h18"></path><path d="M7 14l4-4 3 3 5-6"></path></svg>
                      <span class="lbl">ОПиУ</span>
                    </a>
                  </div>
                  <div class="sb-foot">
                    <span class="avatar avatar--md avatar--tint-2">АК</span>
                    <div class="u-flex-1">
                      <div class="me-name">Анна Кузнецова</div>
                      <div class="me-role">Главный бухгалтер</div>
                    </div>
                    <button class="settings" type="button" title="Выйти">
                      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                    </button>
                  </div>
                </div>
              </aside>
              <main class="app-workzone">
                <div style="border:1px dashed var(--border-hover); border-radius:var(--r-4); height:100%; display:flex; align-items:center; justify-content:center; color:var(--text-muted); font-size:12.5px; font-family:var(--font-mono);">
                  .app-workzone — контент страницы
                </div>
              </main>
            </div>
          </div>
        </div>
