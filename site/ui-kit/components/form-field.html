<!--
  FormField — вертикальная обёртка «подпись сверху, поле снизу», промежуток 5px.
  Соседние .form-field разделяются var(--s-3). Заменяет deprecated .field / .field-label.
  Sizes: — / States: — / Slots: .form-label (+ .req), любое поле (.input, .select, .password-field …)
-->

        <div class="demo demo--column">
          <div class="form-field">
            <label class="form-label" for="ex-ff-1">E-mail</label>
            <input id="ex-ff-1" class="input" type="email" placeholder="you@example.com">
          </div>
          <div class="form-field">
            <label class="form-label" for="ex-ff-2">Пароль <span class="req">*</span></label>
            <div class="password-field">
              <input id="ex-ff-2" class="input" type="password" value="qwerty12345">
              <button type="button" class="password-toggle" aria-label="Показать пароль">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>
        </div>
