services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\Tests\Integration\Ingestion\Fixtures\:
        resource: '../tests/Integration/Ingestion/Fixtures/'

    App\Tests\Integration\Ingestion\Fixtures\FakeConnector:
        tags: ['app.ingestion.connector']

    App\Tests\Integration\Ingestion\Fixtures\FakeMapper:
        tags: ['app.ingestion.mapper']

    App\Tests\Integration\Ingestion\Fixtures\FakeOrderMapper:
        # public, потому что тест настраивает поведение фейка перед прогоном;
        # без этого сервис инлайнится и из контейнера недоступен.
        public: true
        tags: ['app.ingestion.order_mapper']

    App\Ingestion\Application\Source\Wildberries\WbFinanceReportConnector:
        tags: []

    App\Ingestion\Infrastructure\Api\Ozon\OzonAccrualClientInterface: '@App\Tests\Integration\Ingestion\Fixtures\FakeOzonAccrualClient'

    # Клиенты заказов подменяются целиком: цикл перепроса ходит во внешние API,
    # и проверять его на настоящих HTTP-вызовах нечем.
    App\Tests\Integration\Ingestion\Fixtures\FakeOzonOrdersClient:
        public: true

    App\Tests\Integration\Ingestion\Fixtures\FakeWbOrdersClient:
        public: true

    # Часы перепроса двигаются на секунду за обращение: иначе момент снятия
    # отметки не проверить — одна общая отметка на всё подключение выглядит
    # ровно как отметка, снятая после каждого ответа.
    App\Tests\Integration\Ingestion\Fixtures\AdvancingClock: ~

    App\Ingestion\Application\Action\RefreshOrderStatusesAction:
        arguments:
            $clock: '@App\Tests\Integration\Ingestion\Fixtures\AdvancingClock'

    App\Ingestion\Infrastructure\Api\Ozon\OzonOrdersClientInterface: '@App\Tests\Integration\Ingestion\Fixtures\FakeOzonOrdersClient'
    App\Ingestion\Infrastructure\Api\Wildberries\WbOrdersClientInterface: '@App\Tests\Integration\Ingestion\Fixtures\FakeWbOrdersClient'

    test.ingestion_lock_store:
        class: Symfony\Component\Lock\Store\InMemoryStore

    test.ingestion_lock_factory:
        class: Symfony\Component\Lock\LockFactory
        arguments:
            - '@test.ingestion_lock_store'

    App\Ingestion\Application\Service\IngestRateLimitGuard:
        arguments:
            $lockFactory: '@test.ingestion_lock_factory'

    App\Tests\Functional\Api\Fixtures\PermissionController:
        public: true
        tags: ['controller.service_arguments']

    moysklad.http_client:
        class: Symfony\Contracts\HttpClient\HttpClientInterface
        factory: ['Symfony\Component\HttpClient\HttpClient', 'create']
        public: true

    # Вход в Альфу в тестах — заглушка авторизационного сервера на месте провайдера Альфы.
    # Сам провайдер покрыт unit-тестами (MockHttpClient).
    App\BankSync\Infrastructure\Bank\Alfa\AlfaAuthorizationProvider:
        class: App\Tests\Support\BankSync\StubBankAuthorizationProvider
        autowire: false
        arguments: []

    # Billing: integration-тесты берут Action и Facade из контейнера напрямую;
    # без public контейнер инлайнит их в контроллеры и не отдаёт тесту.
    App\Billing\Application\RegisterPaymentAction:
        public: true

    App\Billing\Application\AssignTariffAction:
        public: true

    App\Billing\Application\CancelScheduledTariffAction:
        public: true

    App\Billing\Application\StartTrialAction:
        public: true

    App\Billing\Application\StartCheckoutAction:
        public: true

    App\Billing\Application\ApplyYooKassaPaymentAction:
        public: true

    App\Billing\MessageHandler\ApplyYooKassaPaymentHandler:
        public: true

    App\Billing\Facade\BillingFacadeInterface:
        alias: App\Billing\Facade\BillingFacade
        public: true

    # ЮKassa в тестах — без сети: тест задаёт ответы через setResponseFactory() в формате API v3.
    billing.yookassa.http_client:
        class: Symfony\Component\HttpClient\MockHttpClient
        public: true

    # Тест «ключей нет — кнопки нет» подменяет настройки магазина.
    App\Billing\Infrastructure\YooKassa\YooKassaConfig:
        public: true

    # Budget: integration-тесты берут Action из контейнера напрямую (иначе инлайнятся).
    App\Budget\Application\:
        resource: '../src/Budget/Application/*Action.php'
        public: true

    App\Budget\Application\Service\BudgetGridBuilder:
        public: true

    App\Budget\Application\Service\BudgetPlanFactBuilder:
        public: true

    App\Budget\Application\Service\BudgetYearTotals:
        public: true
    App\Budget\Application\Service\BudgetFillPlanner:
        public: true

    # MarketplaceAnalytics: integration-тест отчёта «Оборачиваемость» берёт Query из контейнера.
    App\MarketplaceAnalytics\Infrastructure\Query\StockTurnoverQuery:
        public: true
