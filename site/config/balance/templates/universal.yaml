# Шаблон структуры баланса для новой компании профиля UNIVERSAL — бизнес без маркетплейсов (онбординг).
# Реестр «профиль → файл» — параметр balance.structure_templates в config/services.yaml.
# Читается BalanceStructureTemplateReader; статьи применяет SeedBalanceStructureAction,
# недостающие статьи и счета у существующих компаний — SyncStandardChartAction.
#
# Версия 4 (2026-11): типовой справочник счетов (как у маркетплейсного, без счетов маркетплейсов),
# статья INV_FULFILLMENT «Склады ФФ (фулфилмент)».
#
# Версия 3 (2026-10): структура маркетплейсного шаблона без расчётов с маркетплейсами и
# складов маркетплейсов; коды статей те же (единый словарь кодов, TemplateRegistryTest).
#
# Контракт:
#   - code — стабильный идентификатор статьи (A-Z, 0-9, _), уникален в файле;
#     по нему статьи связываются со счетами и фондами, менять его в уже
#     выданных компаниях нельзя;
#   - type — asset | passive; дочерние статьи наследуют сторону родителя;
#   - kind — group (может иметь children) | article (конечная, без children);
#     счета привязываются только к article;
#   - accounts — необязательный список учётных счетов конечной статьи:
#     code (A-Z, 0-9, _, уникален среди счетов файла), name, allow_negative
#     (по умолчанию false); недостающие по коду добавляются однократно на версию шаблона;
#   - порядок сортировки задаётся позицией в списке;
#   - profile — профиль бизнеса, для которого написан шаблон; согласие с реестром
#     держит TemplateRegistryTest;
#   - идентификаторы компании и статей в файле не хранятся.
version: 4
profile: UNIVERSAL
articles:
    - code: CURRENT_ASSETS
      name: Оборотные активы
      type: asset
      kind: group
      children:
          - code: MONEY
            name: Денежные средства
            type: asset
            kind: group
            children:
                - code: CASH_BANK
                  name: Расчётные счета
                  type: asset
                  kind: article
                  accounts:
                      - code: ACC_MAIN_BANK
                        name: Расчётный счёт (основной)
                - code: CASH_REGISTER
                  name: Касса
                  type: asset
                  kind: article
                  accounts:
                      - code: ACC_MAIN_REGISTER
                        name: Касса (основная)
                - code: CASH_PAYMENT_SYSTEMS
                  name: Платёжные системы и эквайринг
                  type: asset
                  kind: article
                  accounts:
                      - code: ACC_ACQUIRING
                        name: Эквайринг
          - code: RECEIVABLES
            name: Дебиторская задолженность
            type: asset
            kind: group
            children:
                - code: AR_BUYERS
                  name: Покупатели и заказчики
                  type: asset
                  kind: article
                  accounts:
                      - code: ACC_AR_BUYERS
                        name: Покупатели
                - code: ADVANCES_PAID
                  name: Авансы поставщикам
                  type: asset
                  kind: article
                  accounts:
                      - code: ACC_ADVANCES_PAID
                        name: Авансы поставщикам
                - code: AR_OTHER
                  name: Прочая дебиторская
                  type: asset
                  kind: article
                  accounts:
                      - code: ACC_AR_OTHER
                        name: Прочая дебиторская
          - code: INVENTORY
            name: Запасы
            type: asset
            kind: group
            children:
                - code: INV_WAREHOUSE
                  name: Склад
                  type: asset
                  kind: article
                  accounts:
                      - code: ACC_INV_WAREHOUSE
                        name: Собственный склад
                - code: INV_FULFILLMENT
                  name: Склады ФФ (фулфилмент)
                  type: asset
                  kind: article
                  accounts:
                      - code: ACC_INV_FF
                        name: Склады фулфилмента
                - code: INV_IN_TRANSIT
                  name: Товар в пути
                  type: asset
                  kind: article
                  accounts:
                      - code: ACC_INV_TRANSIT
                        name: Товар в пути
          - code: TAX_RECEIVABLE
            name: Налоги к возмещению
            type: asset
            kind: article
            accounts:
                - code: ACC_VAT_RECEIVABLE
                  name: НДС к возмещению
    - code: NON_CURRENT_ASSETS
      name: Внеоборотные активы
      type: asset
      kind: group
      children:
          - code: FIXED_ASSETS
            name: Основные средства
            type: asset
            kind: article
            accounts:
                - code: ACC_FIXED_ASSETS
                  name: Основные средства
          - code: INTANGIBLES
            name: Нематериальные активы
            type: asset
            kind: article
            accounts:
                - code: ACC_INTANGIBLES
                  name: Нематериальные активы
          - code: LONG_INVESTMENTS
            name: Долгосрочные вложения и выданные займы
            type: asset
            kind: article
            accounts:
                - code: ACC_LOANS_GIVEN
                  name: Выданные займы
    - code: EQUITY
      name: Капитал
      type: passive
      kind: group
      children:
          - code: CONTRIBUTED_CAPITAL
            name: Внесённый капитал
            type: passive
            kind: article
            accounts:
                - code: ACC_CONTRIBUTED
                  name: Вложения собственника
          - code: RETAINED_RESULT
            name: Накопленный финансовый результат
            type: passive
            kind: article
            accounts:
                - code: ACC_RETAINED
                  name: Нераспределённая прибыль
                  allow_negative: true
                - code: ACC_INV_ADJUSTMENT
                  name: Корректировка запасов
                  allow_negative: true
    - code: LIABILITIES
      name: Обязательства
      type: passive
      kind: group
      children:
          - code: CURRENT_LIABILITIES
            name: Краткосрочные обязательства
            type: passive
            kind: group
            children:
                - code: AP_SUPPLIERS
                  name: Поставщики
                  type: passive
                  kind: article
                  accounts:
                      - code: ACC_AP_SUPPLIERS
                        name: Поставщики
                - code: ADVANCES_RECEIVED
                  name: Авансы от покупателей
                  type: passive
                  kind: article
                  accounts:
                      - code: ACC_ADVANCES_RECEIVED
                        name: Авансы полученные
                - code: TAX_PAYABLE
                  name: Налоги и взносы
                  type: passive
                  kind: article
                  accounts:
                      - code: ACC_TAX_PAYABLE
                        name: Налоги к уплате
                - code: PAYROLL_PAYABLE
                  name: Зарплата сотрудникам
                  type: passive
                  kind: article
                  accounts:
                      - code: ACC_PAYROLL
                        name: Зарплата к выплате
                - code: SHORT_LOANS
                  name: Кредиты и займы до года
                  type: passive
                  kind: article
                  accounts:
                      - code: ACC_SHORT_LOANS
                        name: Краткосрочные кредиты
                - code: AP_OTHER
                  name: Прочая кредиторская
                  type: passive
                  kind: article
                  accounts:
                      - code: ACC_AP_OTHER
                        name: Прочая кредиторская
          - code: LONG_LIABILITIES
            name: Долгосрочные обязательства
            type: passive
            kind: group
            children:
                - code: LONG_LOANS
                  name: Кредиты и займы свыше года
                  type: passive
                  kind: article
                  accounts:
                      - code: ACC_LONG_LOANS
                        name: Долгосрочные кредиты
                - code: LONG_OTHER
                  name: Прочие долгосрочные
                  type: passive
                  kind: article
                  accounts:
                      - code: ACC_LONG_OTHER
                        name: Прочие долгосрочные
