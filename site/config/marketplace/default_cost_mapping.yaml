# Базовый маппинг категорий затрат маркетплейса → категории ОПиУ.
#
# Источник истины — кабинет, настроенный вручную владельцем: коды и целевые
# категории сверены с реальной настройкой, а не выведены из названий услуг.
# Правила применяются только к недостающим маппингам; существующие настройки
# компании автонастройка не перезаписывает (см. ApplyDefaultCostMappingAction).
#
# pl_code ссылается на pl_categories.code компании. Если категории с таким
# кодом нет, preview помечает правило как MISSING_PL_CATEGORY и блокирует
# применение целиком — набор применяется полностью либо никак.
#
# confidence:
#   high   — подтверждено настроенным кабинетом либо однозначно по смыслу услуги
#   medium — выведено по аналогии с соседними кодами того же семейства
#   low    — гипотеза, требует подтверждения фин.методологией
#
# is_negative опускается: значение по умолчанию true (затрата уменьшает прибыль).
# Отрицательная сумма в источнике сама даёт сторно — отдельного правила не нужно.
