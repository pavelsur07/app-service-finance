framework:
    rate_limiter:
        reports_api:
            policy: fixed_window
            limit: 60
            interval: '1 minute'
        registration:
            policy: fixed_window
            limit: 5
            interval: '10 minutes'
        marketplace_preliminary_rebuild:
            policy: fixed_window
            limit: 1
            interval: '1 minute'

        # WB Finance API: POST /api/finance/v1/sales-reports/detailed
        # Official WB limit: 1 request per 1 minute per seller account.
        # Use 70 seconds as safety margin.
        wb_finance:
            policy: fixed_window
            limit: 1
            interval: '70 seconds'
            cache_pool: cache.rate_limiter

        # WB Content API: burst 5, then stay below the official 600 ms interval.
        wb_content:
            policy: token_bucket
            limit: 5
            rate:
                interval: '1 second'
                amount: 1
            cache_pool: cache.rate_limiter
