monolog:
    channels:
        - deprecation
        - import.bank1c
        - recalc
        - marketplace_ads
        # Канал приёма Telegram-апдейтов. Нужен отдельным, потому что на проде `main` —
        # fingers_crossed с action_level: error: INFO о принятом апдейте оседает в буфере
        # и до stderr не доходит, пока в том же запросе не случится ошибка. А вебхук
        # отвечает 200 на все ветки, поэтому ошибки может не быть вовсе — и отказ канала
        # становится невидимым. ERROR отсюда по-прежнему уходит в sentry-хендлер.
        - telegram
        # Диагностика производительности Marketplace M1: JSON-строки в var/log/performance-<дата>.jsonl,
        # читает `app:marketplace:perf-report`. Только INFO, без сумм/тел/токенов. Выключается
        # MARKETPLACE_PERF_DIAGNOSTICS=0. См. docs/architecture/marketplace-audit/09-m1-diagnostics.md.
        - performance

when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug # В локальный файл пишем подробно
                channels: ["!event", "!doctrine", "!marketplace_ads", "!performance"]

            performance:
                type: rotating_file
                path: "%kernel.logs_dir%/performance.jsonl"
                level: info
                channels: [performance]
                max_files: 14
                file_permission: 0o666
                formatter: monolog.formatter.json

            marketplace_ads:
                type: rotating_file
                path: "%kernel.logs_dir%/marketplace_ads.log"
                level: debug
                channels: [marketplace_ads]
                max_files: 14

            sentry:
                type: service
                id: Sentry\Monolog\Handler
                # Объём в GlitchTip ограничивают уровень и SentryRateLimiter (10 событий
                # на ключ за 60 с), а не список каналов. Исключать канал здесь нельзя:
                # `marketplace_ads` был исключён, и 15 мест с logger->error() в модуле
                # MarketplaceAds не попадали в GlitchTip вообще — падения
                # app:marketplace-ads:scheduler были видны только внутри общей корзины
                # supercronic. Инвариант закреплён SentryChannelCoverageTest.
                level: error # В GlitchTip только ошибки

            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console", "!marketplace_ads", "!performance"]

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event", "!performance"]
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug

when@prod:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                buffer_size: 50
                channels: ["!marketplace_ads", "!telegram", "!performance"]

            # Файл, а не stderr: отчёт `app:marketplace:perf-report` читает его из общего тома
            # site_var_log (смонтирован во все PHP-контейнеры). Retention — 14 суточных файлов;
            # file_permission 0666 — файл дня может создать процесс другого пользователя
            # (воркер под app, ручной запуск команды под root).
            performance:
                type: rotating_file
                path: "%kernel.logs_dir%/performance.jsonl"
                level: info
                channels: [performance]
                max_files: 14
                file_permission: 0o666
                formatter: monolog.formatter.json

            nested:
                type: stream
                path: php://stderr
                level: debug
                formatter: monolog.formatter.json

            marketplace_ads:
                type: stream
                path: php://stderr
                level: info
                channels: [marketplace_ads]
                formatter: monolog.formatter.json

            # Размен осознанный и такой же, как у marketplace_ads: канал исключён из `main`,
            # поэтому при ошибке в stderr больше не вываливается буфер fingers_crossed на 50
            # записей запроса — зато INFO о принятом апдейте виден всегда, а не только когда
            # в том же запросе случилась ошибка. Для вебхука, который отвечает 200 на все
            # ветки, второе важнее: без него отказ канала не виден вообще.
            # ERROR отсюда по-прежнему уходит в sentry-хендлер — он не ограничен каналами.
            telegram:
                type: stream
                path: php://stderr
                level: info
                channels: [telegram]
                formatter: monolog.formatter.json

            sentry:
                type: service
                id: Sentry\Monolog\Handler
                # Объём в GlitchTip ограничивают уровень и SentryRateLimiter (10 событий
                # на ключ за 60 с), а не список каналов. Исключать канал здесь нельзя:
                # `marketplace_ads` был исключён, и 15 мест с logger->error() в модуле
                # MarketplaceAds не попадали в GlitchTip вообще — падения
                # app:marketplace-ads:scheduler были видны только внутри общей корзины
                # supercronic. Инвариант закреплён SentryChannelCoverageTest.
                level: error # В GlitchTip только ошибки

            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!marketplace_ads", "!performance"]

            deprecation:
                type: stream
                channels: [deprecation]
                path: php://stderr
                formatter: monolog.formatter.json
