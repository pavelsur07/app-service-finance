# Ядро статей ДДС новой компании — одинаковое для всех профилей бизнеса (онбординг).
# Путь — параметр cash.cashflow_core_template в config/services.yaml.
# Читается CashflowCoreTemplateReader, применяет ApplyCashflowCoreTemplateAction —
# только компании без несистемных статей ДДС.
#
# Контракт:
#   - sections — ключ: системный код группы деятельности (CF_OP, CF_FIN, CF_INV),
#     значение: список узлов под ней;
#   - узел с children — группа, без children — статья;
#   - direction — INFLOW | OUTFLOW, обязателен у узлов верхнего уровня секции,
#     вложенные наследуют его;
#   - description — у статьи обязателен: что входит, что не входит и почему; по нему
#     ИИ-автораспределение выбирает статью. Последняя фраза — пометка «ОПиУ: …»:
#     связь со статьёй ОПиУ шаблон не ставит;
#   - порядок сортировки задаётся позицией в списке.
version: 1
sections:
    CF_OP:
        - name: Поступления
          direction: INFLOW
          description: Деньги, пришедшие от основной деятельности компании.
          children:
              - name: Поступления от покупателей
                description: Оплаты клиентов за товары и услуги, авансы покупателей, выплаты маркетплейсов. Возвраты от поставщиков и займы сюда не относить. ОПиУ — не попадает, выручка признаётся по отгрузке или по отчёту площадки, иначе задвоится.
              - name: Возвраты от поставщиков
                description: Деньги, которые поставщик вернул за отменённую или бракованную поставку, возврат переплаты поставщику. Это возврат своих денег, а не доход. ОПиУ — не попадает.
              - name: Прочие поступления
                description: Разовые доходы вне основной деятельности — компенсации, штрафы в нашу пользу, страховые выплаты, кешбэк банка. Проценты банка сюда не относить, для них статья в инвестиционной деятельности. ОПиУ — напрямую, «Прочие доходы».
        - name: Выплаты
          direction: OUTFLOW
          description: Деньги, потраченные на основную деятельность компании.
          children:
              - name: Оплата поставщикам
                description: Оплата товаров, сырья и материалов для перепродажи или производства, включая доставку от поставщика. ОПиУ — не попадает, себестоимость признаётся при продаже товара, а не при оплате.
              - name: Возвраты покупателям
                description: Деньги, возвращённые клиенту за возврат товара или отказ от услуги. ОПиУ — напрямую, «Возвраты и скидки покупателям», уменьшают выручку.
              - name: Доставка и логистика
                description: Курьерские службы, транспортные компании, доставка заказов клиентам. Доставку от поставщика при закупке относить в «Оплата поставщикам». ОПиУ — напрямую, «Доставка до клиента».
              - name: Зарплата
                description: Зарплата, аванс, премии и отпускные сотрудникам на руки. Налоги и взносы с зарплаты — в «Налоги с ФОТ». ОПиУ — напрямую, «ЗП административного персонала»; если платите за прошлый месяц, относите к месяцу начисления.
              - name: Налоги с ФОТ
                description: НДФЛ за сотрудников, страховые взносы, взносы на травматизм — всё, что платится с зарплаты. ОПиУ — напрямую, «Налоги на ФОТ»; обычно платятся за прошлый месяц, относите к месяцу начисления.
              - name: Аренда
                description: Аренда офиса, склада, точки продаж, оборудования. ОПиУ — напрямую, «Аренда помещений»; при оплате вперёд за несколько месяцев распределяйте по месяцам аренды.
              - name: Коммунальные услуги и содержание
                description: Электричество, вода, отопление, уборка, охрана, мелкий ремонт помещений. ОПиУ — напрямую, «Содержание помещений».
              - name: Связь и интернет
                description: Мобильная связь, интернет, телефония, хостинг сайта. ОПиУ — напрямую, «Связь, интернет».
              - name: Сервисы и подписки
                description: Программы и онлайн-сервисы по подписке — 1С, CRM, облачные хранилища, офисные пакеты. ОПиУ — напрямую, «Сервисы и подписки».
              - name: Бухгалтерия, юристы, консультанты
                description: Услуги бухгалтерии, юристов, аудиторов, консультантов, нотариуса. ОПиУ — напрямую, «Административные подрядчики».
              - name: Реклама и маркетинг
                description: Реклама в интернете, блогеры, продвижение, печатные материалы, выставки. Рекламу внутри маркетплейса площадка удерживает сама, её сюда не относить. ОПиУ — напрямую, «Реклама и маркетинг».
              - name: Банковские комиссии и эквайринг
                description: Обслуживание счёта, комиссии за платежи и снятие наличных, эквайринг. Проценты по кредиту сюда не относить. ОПиУ — напрямую, «Банковские комиссии и РКО».
              - name: Налоги
                description: Налоги компании, кроме налогов с зарплаты.
                children:
                    - name: УСН / АУСН
                      description: Авансовые платежи и налог по упрощённой системе. ОПиУ — не попадает, налог начисляется от выручки периода, платёж его задвоит или сдвинет.
                    - name: НДС
                      description: Уплата НДС в бюджет. ОПиУ — не попадает, НДС начисляется от выручки.
                    - name: Налог на прибыль
                      description: Авансовые платежи и налог на прибыль. ОПиУ — не попадает, налог начисляется от прибыли периода.
                    - name: Прочие налоги и сборы
                      description: Налог на имущество, транспортный и земельный налоги, госпошлины, торговый сбор. Налоги с зарплаты сюда не относить. ОПиУ — напрямую, «Прочие расходы».
              - name: Прочие выплаты
                description: Расходы, которые не подходят ни под одну статью. Если сюда регулярно попадают похожие платежи, заведите для них отдельную статью. ОПиУ — напрямую, «Прочие расходы».
    CF_FIN:
        - name: Поступления
          direction: INFLOW
          description: Деньги от кредиторов и собственника.
          children:
              - name: Получение кредитов и займов
                description: Кредиты банка, займы от компаний и физлиц, транш кредитной линии. Это долг, а не доход. ОПиУ — не попадает.
              - name: Взнос собственника
                description: Деньги, которые собственник внёс в бизнес — вклад в капитал, пополнение счёта ИП из личных средств. ОПиУ — не попадает, это не доход.
        - name: Выплаты
          direction: OUTFLOW
          description: Возврат долгов и выплаты собственнику.
          children:
              - name: Погашение кредитов и займов
                description: Возврат тела кредита или займа. Проценты — в статье «Проценты по кредитам и займам». ОПиУ — не попадает, уменьшается долг.
              - name: Проценты по кредитам и займам
                description: Проценты банку или займодавцу. Возврат тела долга сюда не относить. ОПиУ — напрямую, «Проценты по кредитам».
              - name: Выплата собственнику, дивиденды
                description: Дивиденды, вывод прибыли собственником, личные расходы ИП со счёта бизнеса. ОПиУ — напрямую, «Дивиденды».
    CF_INV:
        - name: Поступления
          direction: INFLOW
          description: Деньги от депозитов и продажи имущества компании.
          children:
              - name: Возврат депозитов
                description: Возврат суммы депозита или вклада на расчётный счёт. Проценты — в статье «Проценты по депозитам и остаткам». ОПиУ — не попадает.
              - name: Проценты по депозитам и остаткам
                description: Проценты по депозитам и вкладам, проценты банка на остаток расчётного счёта. ОПиУ — напрямую, «Проценты по депозитам».
              - name: Продажа оборудования
                description: Деньги от продажи оборудования, техники, транспорта, которые служили бизнесу. ОПиУ — напрямую, «Прочие доходы».
        - name: Выплаты
          direction: OUTFLOW
          description: Вложения в депозиты и имущество компании.
          children:
              - name: Размещение депозитов
                description: Перевод денег на депозит или вклад. Это перемещение своих денег, не расход. ОПиУ — не попадает.
              - name: Покупка оборудования и техники
                description: Оборудование, компьютеры, транспорт, мебель — всё, что служит дольше года. ОПиУ — не попадает, расход идёт через амортизацию.
