# Ядро статей ДДС новой компании — одинаковое для всех профилей бизнеса (онбординг).
# Путь — параметр cash.cashflow_core_template в config/services.yaml.
# Читается CashflowCoreTemplateReader, применяет ApplyCashflowCoreTemplateAction —
# только компании без несистемных статей ДДС.
#
# Контракт:
#   - sections — ключ: системный код группы деятельности (CF_OP, CF_FIN, CF_INV),
#     значение: список узлов под ней;
#   - code — обязателен у каждого узла: ключ консолидации (`cashflow_categories.group_code`),
#     формат {OP|FIN|INV}_{IN|OUT}[_{SLUG}] по секции и направлению узла, уникален в файле;
#     утверждён Владельцем 17.11.2026 (docs/tasks/cashflow-group-chart/chart.md) и не меняется:
#     статья с новым смыслом получает новый код, старый не переиспользуется;
#   - узел с children — группа, без children — статья;
#   - direction — INFLOW | OUTFLOW, обязателен у узлов верхнего уровня секции,
#     вложенные наследуют его;
#   - description — у статьи обязателен: что входит, что не входит и почему; по нему
#     ИИ-автораспределение выбирает статью. Последняя фраза — пометка
#     «ОПиУ — напрямую, в …» или «ОПиУ — не попадает»: связь со статьёй ОПиУ шаблон
#     не ставит, а названия статей ОПиУ у профилей разные — пометка называет смысл,
#     а не статью;
#   - порядок сортировки задаётся позицией в списке.
version: 2
sections:
    CF_OP:
        - code: OP_IN
          name: Поступления
          direction: INFLOW
          description: Деньги, пришедшие от основной деятельности компании.
          children:
              - code: OP_IN_CUSTOMERS
                name: Поступления от покупателей
                description: Оплаты клиентов за товары и услуги, авансы покупателей, выплаты маркетплейсов. Возвраты от поставщиков и займы сюда не относить. ОПиУ — не попадает, выручка признаётся по отгрузке или по отчёту площадки, иначе задвоится.
              - code: OP_IN_SUPPLIER_REFUNDS
                name: Возвраты от поставщиков
                description: Деньги, которые поставщик вернул за отменённую или бракованную поставку, возврат переплаты поставщику. Это возврат своих денег, а не доход. ОПиУ — не попадает.
              - code: OP_IN_OTHER
                name: Прочие поступления
                description: Разовые доходы вне основной деятельности — компенсации, штрафы в нашу пользу, страховые выплаты, кешбэк банка. Проценты банка сюда не относить, для них статья в инвестиционной деятельности. ОПиУ — напрямую, в прочие доходы.
        - code: OP_OUT
          name: Выплаты
          direction: OUTFLOW
          description: Деньги, потраченные на основную деятельность компании.
          children:
              - code: OP_OUT_SUPPLIERS
                name: Оплата поставщикам
                description: Оплата товаров, сырья и материалов для перепродажи или производства, включая доставку от поставщика. ОПиУ — не попадает, себестоимость признаётся при продаже товара, а не при оплате.
              - code: OP_OUT_CUSTOMER_REFUNDS
                name: Возвраты покупателям
                description: 'Деньги, возвращённые клиенту за возврат товара или отказ от услуги. Для селлеров: возвраты маркетплейсов сюда не относить — они уже в отчёте площадки. ОПиУ — напрямую, в возвраты покупателям, уменьшают выручку.'
              - code: OP_OUT_DELIVERY
                name: Доставка и логистика
                description: Курьерские службы, транспортные компании, доставка заказов клиентам. Доставку от поставщика при закупке относить в «Оплата поставщикам». ОПиУ — напрямую, в логистику до клиента.
              - code: OP_OUT_SALARY
                name: Зарплата
                description: Зарплата, аванс, премии и отпускные сотрудникам на руки. Налоги и взносы с зарплаты — в «Налоги с ФОТ». ОПиУ — напрямую, в расходы на зарплату; если платите за прошлый месяц, относите к месяцу начисления.
              - code: OP_OUT_PAYROLL_TAXES
                name: Налоги с ФОТ
                description: НДФЛ за сотрудников, страховые взносы, взносы на травматизм — всё, что платится с зарплаты. ОПиУ — напрямую, в налоги на ФОТ; обычно платятся за прошлый месяц, относите к месяцу начисления.
              - code: OP_OUT_RENT
                name: Аренда
                description: Аренда офиса, склада, точки продаж, оборудования. ОПиУ — напрямую, в расходы на аренду; при оплате вперёд за несколько месяцев распределяйте по месяцам аренды.
              - code: OP_OUT_UTILITIES
                name: Коммунальные услуги и содержание
                description: Электричество, вода, отопление, уборка, охрана, мелкий ремонт помещений. ОПиУ — напрямую, в расходы на содержание помещений.
              - code: OP_OUT_TELECOM
                name: Связь и интернет
                description: Мобильная связь, интернет, телефония, хостинг сайта. ОПиУ — напрямую, в расходы на связь.
              - code: OP_OUT_SOFTWARE
                name: Сервисы и подписки
                description: Программы и онлайн-сервисы по подписке — 1С, CRM, облачные хранилища, офисные пакеты. ОПиУ — напрямую, в расходы на сервисы и подписки.
              - code: OP_OUT_PROFESSIONAL
                name: Бухгалтерия, юристы, консультанты
                description: Услуги бухгалтерии, юристов, аудиторов, консультантов, нотариуса. ОПиУ — напрямую, в административные расходы.
              - code: OP_OUT_MARKETING
                name: Реклама и маркетинг
                description: Реклама в интернете, блогеры, продвижение, печатные материалы, выставки. Рекламу внутри маркетплейса площадка удерживает сама, её сюда не относить. ОПиУ — напрямую, в расходы на рекламу.
              - code: OP_OUT_BANK_FEES
                name: Банковские комиссии и эквайринг
                description: Обслуживание счёта, комиссии за платежи и снятие наличных, эквайринг. Проценты по кредиту сюда не относить. ОПиУ — напрямую, в банковские комиссии.
              - code: OP_OUT_TAXES
                name: Налоги
                description: Налоги компании, кроме налогов с зарплаты.
                children:
                    - code: OP_OUT_TAX_USN
                      name: УСН / АУСН
                      description: Авансовые платежи и налог по упрощённой системе. ОПиУ — не попадает, налог начисляется от выручки периода, платёж его задвоит или сдвинет.
                    - code: OP_OUT_TAX_VAT
                      name: НДС
                      description: Уплата НДС в бюджет. ОПиУ — не попадает, НДС начисляется от выручки.
                    - code: OP_OUT_TAX_PROFIT
                      name: Налог на прибыль
                      description: Авансовые платежи и налог на прибыль. ОПиУ — не попадает, налог начисляется от прибыли периода.
                    - code: OP_OUT_TAX_OTHER
                      name: Прочие налоги и сборы
                      description: Налог на имущество, транспортный и земельный налоги, госпошлины, торговый сбор. Налоги с зарплаты сюда не относить. ОПиУ — напрямую, в прочие расходы.
              - code: OP_OUT_OTHER
                name: Прочие выплаты
                description: Расходы, которые не подходят ни под одну статью. Если сюда регулярно попадают похожие платежи, заведите для них отдельную статью. ОПиУ — напрямую, в прочие расходы.
    CF_FIN:
        - code: FIN_IN
          name: Поступления
          direction: INFLOW
          description: Деньги от кредиторов и собственника.
          children:
              - code: FIN_IN_LOANS
                name: Получение кредитов и займов
                description: Кредиты банка, займы от компаний и физлиц, транш кредитной линии. Это долг, а не доход. ОПиУ — не попадает.
              - code: FIN_IN_OWNER_CONTRIBUTION
                name: Взнос собственника
                description: Деньги, которые собственник внёс в бизнес — вклад в капитал, пополнение счёта ИП из личных средств. ОПиУ — не попадает, это не доход.
        - code: FIN_OUT
          name: Выплаты
          direction: OUTFLOW
          description: Возврат долгов и выплаты собственнику.
          children:
              - code: FIN_OUT_LOAN_REPAYMENT
                name: Погашение кредитов и займов
                description: Возврат тела кредита или займа. Проценты — в статье «Проценты по кредитам и займам». ОПиУ — не попадает, уменьшается долг.
              - code: FIN_OUT_INTEREST
                name: Проценты по кредитам и займам
                description: Проценты банку или займодавцу. Возврат тела долга сюда не относить. ОПиУ — напрямую, в проценты к уплате.
              - code: FIN_OUT_DIVIDENDS
                name: Выплата собственнику, дивиденды
                description: Дивиденды, вывод прибыли собственником, личные расходы ИП со счёта бизнеса. ОПиУ — напрямую, в распределение прибыли.
    CF_INV:
        - code: INV_IN
          name: Поступления
          direction: INFLOW
          description: Деньги от депозитов и продажи имущества компании.
          children:
              - code: INV_IN_DEPOSIT_RETURN
                name: Возврат депозитов
                description: Возврат суммы депозита или вклада на расчётный счёт. Проценты — в статье «Проценты по депозитам и остаткам». ОПиУ — не попадает.
              - code: INV_IN_INTEREST
                name: Проценты по депозитам и остаткам
                description: Проценты по депозитам и вкладам, проценты банка на остаток расчётного счёта. ОПиУ — напрямую, в проценты к получению.
              - code: INV_IN_ASSET_SALE
                name: Продажа оборудования
                description: Деньги от продажи оборудования, техники, транспорта, которые служили бизнесу. Если оборудование ещё не самортизировано, остаточную стоимость отнесите в прочие расходы вручную. ОПиУ — напрямую, в прочие доходы.
        - code: INV_OUT
          name: Выплаты
          direction: OUTFLOW
          description: Вложения в депозиты и имущество компании.
          children:
              - code: INV_OUT_DEPOSIT_PLACEMENT
                name: Размещение депозитов
                description: Перевод денег на депозит или вклад. Это перемещение своих денег, не расход. ОПиУ — не попадает.
              - code: INV_OUT_ASSET_PURCHASE
                name: Покупка оборудования и техники
                description: Оборудование, компьютеры, транспорт, мебель — всё, что служит дольше года. ОПиУ — не попадает, расход идёт через амортизацию.
