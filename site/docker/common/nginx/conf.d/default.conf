# request_uri survives the internal redirect to index.php. New SPA endpoints
# are same-origin only; retain the legacy CORS policy elsewhere.
map $request_uri $spa_api_request {
    default 0;
    ~^/api/(account|admin)/v1(/|\?|$) 1;
}
map $spa_api_request $legacy_cors_origin { default '*'; 1 ''; }
map $spa_api_request $legacy_cors_credentials { default 'true'; 1 ''; }
map $spa_api_request $legacy_cors_methods { default 'GET,POST,PUT,DELETE,HEAD,OPTIONS'; 1 ''; }
map $spa_api_request $legacy_cors_headers { default 'Origin,Content-Type,Accept,Authorization,X-Features'; 1 ''; }

server {
    listen 80;
    charset utf-8;
    index index.php;
    root /app/public;
    server_tokens off;

    client_max_body_size 32M;

    resolver 127.0.0.11 ipv6=off;

    location /health {
        add_header Content-Type text/plain;
        return 200 'alive';
    }

    add_header 'Access-Control-Allow-Origin' $legacy_cors_origin always;
    add_header 'Access-Control-Allow-Credentials' $legacy_cors_credentials always;
    add_header 'Access-Control-Allow-Methods' $legacy_cors_methods always;
    add_header 'Access-Control-Allow-Headers' $legacy_cors_headers always;

    # Внутренний API сервисов services/: только напрямую из docker-сети.
    # Публичный traefik всегда ставит X-Forwarded-For — такой запрос сюда не пускаем.
    location ^~ /internal/ {
        if ($http_x_forwarded_for) {
            return 404;
        }
        try_files $uri /index.php?$args;
    }

    location / {
        try_files $uri /index.php?$args;
    }

    location ~ \.php$ {
        fastcgi_pass site-php-fpm:9000;
        fastcgi_index index.php;
        fastcgi_read_timeout 300;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }
}
