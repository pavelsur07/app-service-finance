name: 🚀 Deploy Gateway

# Шлюз 109.73.204.179 (системный nginx): tg.vashfindir.ru. Устройство — gateway/README.md.
on:
    workflow_dispatch:

    pull_request:
        paths:
            - 'gateway/**'
            - '.github/workflows/deploy-gateway.yml'

    push:
        branches: [ master ]
        paths:
            - 'gateway/**'
            - '.github/workflows/deploy-gateway.yml'

concurrency:
    group: deploy-gateway-${{ github.ref }}
    cancel-in-progress: false

jobs:
    validate:
        name: 🔎 nginx -t gateway
        runs-on: ubuntu-latest

        steps:
            - name: 📦 Checkout repository
              uses: actions/checkout@v4

            - name: 🐚 shellcheck
              run: shellcheck gateway/scripts/*.sh

            - name: 🔎 nginx -t
              run: gateway/scripts/nginx-test.sh

    deploy:
        name: 🚀 Deploy gateway
        needs: validate
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        runs-on: ubuntu-latest

        steps:
            - name: 📦 Checkout repository
              uses: actions/checkout@v4

            - name: 🔐 Setup SSH key
              uses: webfactory/ssh-agent@v0.8.0
              with:
                  ssh-private-key: ${{ secrets.TG_SSH_PRIVATE_KEY }}

            - name: 📤 Upload gateway files
              env:
                  TARGET: ${{ secrets.TG_SERVER_USER }}@${{ secrets.TG_SERVER_HOST }}
              run: |
                  tar -C gateway -czf gateway.tgz nginx scripts/install.sh
                  scp -o StrictHostKeyChecking=no gateway.tgz "$TARGET":/tmp/gateway.tgz

            - name: 🚀 Install and reload nginx
              env:
                  TARGET: ${{ secrets.TG_SERVER_USER }}@${{ secrets.TG_SERVER_HOST }}
              run: |
                  ssh -o StrictHostKeyChecking=no "$TARGET" << 'EOF'
                      set -e
                      STAGE=$(mktemp -d)
                      trap 'rm -rf "$STAGE" /tmp/gateway.tgz' EXIT
                      tar -C "$STAGE" -xzf /tmp/gateway.tgz
                      bash "$STAGE/scripts/install.sh" "$STAGE/nginx"
                  EOF
