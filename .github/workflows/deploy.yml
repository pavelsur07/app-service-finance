name: 🚀 Deploy to Production

on:
    push:
        branches: [ master ]
    pull_request:
    workflow_dispatch:
        inputs:
            production_action:
                description: Production gate to execute
                required: true
                default: none
                type: choice
                options:
                    - none
                    - deploy
                    - migrations

jobs:
    # 0. ЧТО ИЗМЕНИЛОСЬ: один источник правды для path-фильтров.
    #    Остальные job'ы гейтятся по этим выходам, поэтому фронт-, бэк-
    #    и landing-правки больше не тянут весь пайплайн.
    changes:
        name: 🔎 Detect changes
        runs-on: ubuntu-latest
        outputs:
            backend: ${{ steps.matrix.outputs.backend }}
            static_analysis: ${{ steps.matrix.outputs.static_analysis }}
            frontend: ${{ steps.matrix.outputs.frontend }}
            landing: ${{ steps.matrix.outputs.landing }}
            matrix: ${{ steps.matrix.outputs.matrix }}
        steps:
            - name: 📦 Checkout repository
              uses: actions/checkout@v6

            - name: 🔎 Path filter
              uses: dorny/paths-filter@v4
              id: f
              if: ${{ github.event_name != 'workflow_dispatch' }}
              with:
                  filters: |
                      backend:
                        - 'site/src/**'
                        - 'site/config/**'
                        - 'site/migrations/**'
                        - 'site/templates/**'
                        - 'site/public/**'
                        - 'site/bin/**'
                        - 'site/tests/**'
                        - 'site/composer.json'
                        - 'site/composer.lock'
                        - 'site/docker/**'
                        - '.github/workflows/deploy.yml'
                      frontend:
                        - 'site/assets/**'
                        # ui-kit — исходники стилей: app.css тянет их через @import,
                        # nginx-образ пекёт в бандл (COPY . . + yarn build).
                        - 'site/ui-kit/**'
                        - 'site/vite.config.js'
                        - 'site/package.json'
                        - 'site/yarn.lock'
                      landing:
                        - 'landing/**'
                      # Не входит в deployable-матрицу: правка конфига или baseline
                      # PHPStan обязана снова прогнать анализ, но production-образы
                      # и деплой от неё не зависят. Dev-образ php-cli при этом может
                      # собраться — это среда прогона анализа, не артефакт релиза.
                      # Без этого фильтра PR, перегенерировавший baseline «начисто»,
                      # обошёл бы гейт целиком.
                      static_analysis:
                        - 'site/phpstan.dist.neon'
                        - 'site/phpstan-baseline.neon'

            # В PR собираем матрицу образов ровно под то, что изменилось:
            #   frontend        → site-nginx + site-php-fpm (оба пекут public/build)
            #   backend         → site-nginx + site-php-fpm + site-php-cli
            #   landing         → land-nginx
            # На push в master с deployable-изменениями собираем полный набор:
            # rolling deploy тянет все образы по единому commit SHA.
            - name: 🧩 Build image matrix
              id: matrix
              env:
                  PRODUCTION_ACTION: ${{ inputs.production_action }}
              run: |
                  be='${{ steps.f.outputs.backend }}'
                  fe='${{ steps.f.outputs.frontend }}'
                  la='${{ steps.f.outputs.landing }}'
                  sa='${{ steps.f.outputs.static_analysis }}'

                  if [ "$GITHUB_EVENT_NAME" = 'push' ] && [ "$GITHUB_REF" = 'refs/heads/master' ]; then
                    if [ "$be" = 'true' ] || [ "$fe" = 'true' ] || [ "$la" = 'true' ]; then
                      be=true
                      la=true
                    fi
                  fi

                  if [ "$GITHUB_EVENT_NAME" = 'workflow_dispatch' ]; then
                    be=false
                    fe=false
                    la=false
                    sa=false

                    if [ "$PRODUCTION_ACTION" != 'none' ] && [ "$GITHUB_REF" != 'refs/heads/master' ]; then
                      echo '::error::Production gates can run only from master'
                      exit 1
                    fi

                    if [ "$PRODUCTION_ACTION" = 'deploy' ]; then
                      be=true
                      la=true
                    fi
                  fi

                  items=()
                  # site-nginx и site-php-fpm оба пекут public/build из одного yarn build
                  # (nginx отдаёт файлы, fpm хранит manifest для Twig) — на фронт-правке
                  # их нужно пересобирать вместе, иначе manifest разъедется с файлами.
                  if [ "$be" = "true" ] || [ "$fe" = "true" ]; then
                    items+=('{"service":"site-nginx","context":"./site","file":"./site/docker/production/nginx/Dockerfile","image":"site-nginx"}')
                    items+=('{"service":"site-php-fpm","context":"./site","file":"./site/docker/production/php-fpm/Dockerfile","image":"site-php-fpm"}')
                  fi
                  # site-php-cli (воркеры/CLI) ассеты не пекут — только на бэкенд-правке.
                  if [ "$be" = "true" ]; then
                    items+=('{"service":"site-php-cli","context":"./site","file":"./site/docker/production/php-cli/Dockerfile","image":"site-php-cli"}')
                  fi
                  if [ "$la" = "true" ]; then
                    items+=('{"service":"landing","context":"./landing","file":"./landing/docker/production/nginx/Dockerfile","image":"land-nginx"}')
                  fi
                  IFS=,
                  echo "backend=$be" >> "$GITHUB_OUTPUT"
                  echo "frontend=$fe" >> "$GITHUB_OUTPUT"
                  echo "landing=$la" >> "$GITHUB_OUTPUT"
                  echo "static_analysis=$sa" >> "$GITHUB_OUTPUT"
                  echo "matrix={\"include\":[${items[*]}]}" >> "$GITHUB_OUTPUT"

    # Dev-образ php-cli для тестовых job'ов: публикуется в ghcr и переиспользуется.
    #   Тег — хеш входов образа (Dockerfile + conf.d + wait-for-it), поэтому пересборка
    #   нужна только когда эти файлы реально менялись; иначе job лишь проверяет реестр.
    #   На pull_request push в ghcr невозможен — так же, как у build-and-push, — поэтому
    #   тестовые job'ы при отсутствии тега собирают образ сами (fallback у них внутри).
    dev-image:
        name: 🐳 Dev image
        needs: changes
        # static_analysis — потому что от этого образа зависит job `stan`.
        if: ${{ needs.changes.outputs.backend == 'true' || needs.changes.outputs.static_analysis == 'true' }}
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        outputs:
            tag: ${{ steps.tag.outputs.tag }}
        steps:
            - name: 📦 Checkout repository
              uses: actions/checkout@v6

            - name: 🏷 Compute image tag from build inputs
              id: tag
              run: |
                  TAG=$(find site/docker/development/php-cli/Dockerfile \
                             site/docker/common/php/conf.d \
                             site/docker/development/php/conf.d \
                             site/docker/common/wait-for-it.sh \
                          -type f | sort | xargs sha256sum | sha256sum | cut -c1-16)
                  echo "tag=$TAG" >> "$GITHUB_OUTPUT"
                  echo "Тег dev-образа: $TAG"

            - name: 🔐 Login to GHCR
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: 🔎 Is the tag already published?
              id: check
              run: |
                  if docker manifest inspect "ghcr.io/pavelsur07/site-php-cli-dev:${{ steps.tag.outputs.tag }}" >/dev/null 2>&1; then
                      echo "available=true" >> "$GITHUB_OUTPUT"
                      echo "Образ уже в реестре — сборка не нужна."
                  else
                      echo "available=false" >> "$GITHUB_OUTPUT"
                      echo "Образа нет, потребуется сборка."
                  fi

            - name: 🛠 Set up Docker Buildx
              if: ${{ steps.check.outputs.available == 'false' }}
              uses: docker/setup-buildx-action@v4

            - name: 🐳 Build and publish dev image
              if: ${{ steps.check.outputs.available == 'false' }}
              uses: docker/build-push-action@v7
              with:
                  context: site/docker
                  file: site/docker/development/php-cli/Dockerfile
                  push: ${{ github.event_name != 'pull_request' }}
                  tags: ghcr.io/pavelsur07/site-php-cli-dev:${{ steps.tag.outputs.tag }}

    unit-tests:
        name: 🧪 Unit tests
        needs: [ changes, dev-image ]
        if: ${{ needs.changes.outputs.backend == 'true' }}
        runs-on: ubuntu-latest
        env:
            COMPOSE_PROJECT_NAME: app-service-finance
        steps:
            - name: 📦 Checkout repository
              uses: actions/checkout@v6

            - name: 🔐 Login to GHCR
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: 🐳 Pull dev image (fallback — local build)
              run: |
                  IMG="ghcr.io/pavelsur07/site-php-cli-dev:${{ needs.dev-image.outputs.tag }}"
                  if docker pull -q "$IMG"; then
                      docker tag "$IMG" app-service-finance-site-php-cli:latest
                      echo "Образ получен из ghcr: $IMG"
                  else
                      echo "Образа нет в ghcr — собираю локально."
                      docker compose build site-php-cli
                  fi

            - name: 📦 Cache composer dependencies
              uses: actions/cache@v4
              with:
                  path: site/vendor
                  key: composer-${{ hashFiles('site/composer.lock') }}
                  restore-keys: composer-

            - name: 📦 Install PHP dependencies
              run: |
                  docker compose run --rm -T \
                    --user "$(id -u):$(id -g)" \
                    -e COMPOSER_HOME=/tmp/composer \
                    site-php-cli composer install --no-interaction --prefer-dist --no-progress --no-scripts

            - name: 🧪 Run unit tests
              run: |
                  docker compose run --rm -T \
                    --user "$(id -u):$(id -g)" \
                    -e COMPOSER_HOME=/tmp/composer \
                    -e APP_ENV=test \
                    -e APP_DEBUG=0 \
                    -e APP_SECRET=test \
                    -e DEFAULT_URI=http://localhost \
                    site-php-cli composer test:unit

    cs-check:
        name: 🎨 PHP code style
        needs: [ changes, dev-image ]
        if: ${{ needs.changes.outputs.backend == 'true' }}
        runs-on: ubuntu-latest
        env:
            COMPOSE_PROJECT_NAME: app-service-finance
        steps:
            - name: 📦 Checkout repository
              uses: actions/checkout@v6

            - name: 🔐 Login to GHCR
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: 🐳 Pull dev image (fallback — local build)
              run: |
                  IMG="ghcr.io/pavelsur07/site-php-cli-dev:${{ needs.dev-image.outputs.tag }}"
                  if docker pull -q "$IMG"; then
                      docker tag "$IMG" app-service-finance-site-php-cli:latest
                      echo "Образ получен из ghcr: $IMG"
                  else
                      echo "Образа нет в ghcr — собираю локально."
                      docker compose build site-php-cli
                  fi

            - name: 📦 Cache composer dependencies
              uses: actions/cache@v4
              with:
                  path: site/vendor
                  key: composer-${{ hashFiles('site/composer.lock') }}
                  restore-keys: composer-

            - name: 📦 Install PHP dependencies
              run: |
                  docker compose run --rm -T \
                    --user "$(id -u):$(id -g)" \
                    -e COMPOSER_HOME=/tmp/composer \
                    site-php-cli composer install --no-interaction --prefer-dist --no-progress --no-scripts

            - name: 🎨 Cache php-cs-fixer results
              uses: actions/cache@v4
              with:
                  path: |
                      site/var/cache/.php-cs-fixer.cache
                      site/var/cache/.php-cs-fixer.strict-types.cache
                  key: cs-fixer-${{ hashFiles('site/.php-cs-fixer.php', 'site/.php-cs-fixer.strict-types.php') }}-${{ github.sha }}
                  restore-keys: cs-fixer-${{ hashFiles('site/.php-cs-fixer.php', 'site/.php-cs-fixer.strict-types.php') }}-

            - name: 🎨 Check PHP code style
              run: |
                  docker compose run --rm -T \
                    --user "$(id -u):$(id -g)" \
                    -e COMPOSER_HOME=/tmp/composer \
                    site-php-cli composer cs:check

            - name: 🔒 Check declare(strict_types=1)
              run: |
                  docker compose run --rm -T \
                    --user "$(id -u):$(id -g)" \
                    -e COMPOSER_HOME=/tmp/composer \
                    site-php-cli composer cs:strict-types

    # СТАТИЧЕСКИЙ АНАЛИЗ ТИПИЗАЦИИ — PHPStan level 8.
    #   Сознательно НЕ добавлен в needs у build-and-push: гейтит PR, но не блокирует
    #   сборку и деплой. Поведение Production-пайплайна этим job'ом не меняется.
    #   Достижимо зелёный: унаследованные ошибки лежат в site/phpstan-baseline.neon,
    #   на PR проверяется только то, что изменил автор.
    stan:
        name: 🔬 Static analysis
        needs: [ changes, dev-image ]
        if: ${{ needs.changes.outputs.backend == 'true' || needs.changes.outputs.static_analysis == 'true' }}
        runs-on: ubuntu-latest
        env:
            COMPOSE_PROJECT_NAME: app-service-finance
        steps:
            - name: 📦 Checkout repository
              uses: actions/checkout@v6

            # Ratchet стоит первым шагом сознательно: рост baseline не требует ни
            # образа, ни зависимостей, ни анализа, поэтому падает до них, а не
            # после двух минут работы. Совсем «за секунды» не выйдет: job ждёт
            # dev-image через needs — вынести проверку в отдельный job без этой
            # зависимости можно, но ради экономии ~15 с плодить job не стали.
            # Пропуск возможен только по явной метке в заголовке PR: молча
            # вырасти baseline не может.
            - name: 📉 Baseline не должен расти
              if: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.title, '[baseline-grow]') }}
              run: |
                  BASE_SHA='${{ github.event.pull_request.base.sha }}'
                  if ! git fetch --no-tags --depth=1 origin "$BASE_SHA"; then
                      echo "::error::не удалось получить базу сравнения $BASE_SHA"
                      exit 1
                  fi
                  if git cat-file -e "$BASE_SHA:site/phpstan-baseline.neon" 2>/dev/null; then
                      git show "$BASE_SHA:site/phpstan-baseline.neon" > /tmp/baseline-base.neon
                  else
                      echo "В базе сравнения baseline ещё нет — проверка роста неприменима."
                      : > /tmp/baseline-base.neon
                  fi
                  site/bin/phpstan-baseline-guard.sh /tmp/baseline-base.neon site/phpstan-baseline.neon

            - name: 🔐 Login to GHCR
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: 🐳 Pull dev image (fallback — local build)
              run: |
                  IMG="ghcr.io/pavelsur07/site-php-cli-dev:${{ needs.dev-image.outputs.tag }}"
                  if docker pull -q "$IMG"; then
                      docker tag "$IMG" app-service-finance-site-php-cli:latest
                      echo "Образ получен из ghcr: $IMG"
                  else
                      echo "Образа нет в ghcr — собираю локально."
                      docker compose build site-php-cli
                  fi

            - name: 📦 Cache composer dependencies
              uses: actions/cache@v4
              with:
                  path: site/vendor
                  key: composer-${{ hashFiles('site/composer.lock') }}
                  restore-keys: composer-

            - name: 📦 Install PHP dependencies
              run: |
                  docker compose run --rm -T \
                    --user "$(id -u):$(id -g)" \
                    -e COMPOSER_HOME=/tmp/composer \
                    site-php-cli composer install --no-interaction --prefer-dist --no-progress --no-scripts

            # Result cache PHPStan: холодный прогон 2347 файлов идёт минуты,
            # тёплый — секунды. Ключ включает baseline и конфиг: их правка
            # обязана инвалидировать кэш. XML контейнера в ключ не входит — его
            # хеширует само расширение (SymfonyContainerResultCacheMetaExtension),
            # поэтому пересобранный контейнер кэш инвалидирует сам.
            - name: 🔬 Cache PHPStan result cache
              uses: actions/cache@v4
              with:
                  path: site/var/cache/phpstan
                  key: phpstan-${{ hashFiles('site/composer.lock', 'site/phpstan.dist.neon', 'site/phpstan-baseline.neon') }}-${{ github.sha }}
                  restore-keys: phpstan-${{ hashFiles('site/composer.lock', 'site/phpstan.dist.neon', 'site/phpstan-baseline.neon') }}-

            # Расширения phpstan-symfony/phpstan-doctrine анализируют скомпилированный
            # DI-контейнер. Отдельный шаг, а не часть запуска анализа: ошибка компиляции
            # контейнера должна падать здесь и читаться как ошибка контейнера.
            - name: 🔥 Warm Symfony container
              run: |
                  docker compose run --rm -T \
                    --user "$(id -u):$(id -g)" \
                    -e COMPOSER_HOME=/tmp/composer \
                    site-php-cli php bin/console cache:warmup --env=test

            - name: 🔬 Run PHPStan
              run: |
                  docker compose run --rm -T \
                    --user "$(id -u):$(id -g)" \
                    -e COMPOSER_HOME=/tmp/composer \
                    -e COMPOSER_PROCESS_TIMEOUT=0 \
                    site-php-cli composer stan -- --no-progress --error-format=github

    # ИНТЕГРАЦИОННЫЕ И ФУНКЦИОНАЛЬНЫЕ ТЕСТЫ — на реальной БД.
    #   Идёт ПАРАЛЛЕЛЬНО сборке и гейтит не её, а деплой: собранный образ безвреден,
    #   выкаченный непротестированный — нет. Тесты укладываются в окно, которое
    #   пайплайн и так тратит на сборку четырёх образов.
    #   Unit покрыты job'ом unit-tests и здесь не дублируются.
    # Сьюты режутся на параллельные legs: functional идёт ~275 с одним процессом и
    #   делает backend-tests критическим путём. GitHub даёт параллельные job'ы
    #   бесплатно, поэтому каждый leg получает свой раннер, свою БД и свою часть.
    #   Раскладка functional считается bin/functional-shard.sh — списки не
    #   захардкожены, новый каталог подхватывается сам.
    backend-tests:
        name: 🧪 ${{ matrix.name }}
        needs: [ changes, dev-image ]
        if: ${{ needs.changes.outputs.backend == 'true' }}
        runs-on: ubuntu-latest
        env:
            COMPOSE_PROJECT_NAME: app-service-finance
        strategy:
            # Падение одного leg не отменяет остальные: нужен полный список
            # упавших тестов, а не первый попавшийся.
            fail-fast: false
            matrix:
                include:
                    - name: Integration tests
                      suite: integration
                    - name: Functional tests 1/3
                      suite: functional
                      shard: 0
                    - name: Functional tests 2/3
                      suite: functional
                      shard: 1
                    - name: Functional tests 3/3
                      suite: functional
                      shard: 2
        steps:
            - name: 📦 Checkout repository
              uses: actions/checkout@v6

            - name: 🔐 Login to GHCR
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: 🐳 Pull dev image (fallback — local build)
              run: |
                  IMG="ghcr.io/pavelsur07/site-php-cli-dev:${{ needs.dev-image.outputs.tag }}"
                  if docker pull -q "$IMG"; then
                      docker tag "$IMG" app-service-finance-site-php-cli:latest
                      echo "Образ получен из ghcr: $IMG"
                  else
                      echo "Образа нет в ghcr — собираю локально."
                      docker compose build site-php-cli
                  fi

            - name: 📦 Cache composer dependencies
              uses: actions/cache@v4
              with:
                  path: site/vendor
                  key: composer-${{ hashFiles('site/composer.lock') }}
                  restore-keys: composer-

            - name: 🗄️ Start Postgres and Redis
              run: docker compose up -d site-postgres site-redis

            - name: 📦 Install PHP dependencies
              run: |
                  docker compose run --rm -T \
                    --user "$(id -u):$(id -g)" \
                    -e COMPOSER_HOME=/tmp/composer \
                    site-php-cli composer install --no-interaction --prefer-dist --no-progress --no-scripts

            - name: ⏳ Wait for Postgres
              run: |
                  until docker compose exec -T site-postgres pg_isready --timeout=0 --dbname=app; do sleep 1; done

            - name: 🧬 Create test database and run migrations
              run: |
                  docker compose run --rm -T \
                    --user "$(id -u):$(id -g)" \
                    -e COMPOSER_HOME=/tmp/composer \
                    site-php-cli php bin/console doctrine:database:create --if-not-exists --env=test
                  docker compose run --rm -T \
                    --user "$(id -u):$(id -g)" \
                    -e COMPOSER_HOME=/tmp/composer \
                    site-php-cli php bin/console doctrine:migrations:migrate --no-interaction --env=test

            - name: 🧪 Run ${{ matrix.name }}
              run: |
                  if [ "${{ matrix.suite }}" = "integration" ]; then
                      docker compose run --rm -T \
                        --user "$(id -u):$(id -g)" \
                        -e COMPOSER_HOME=/tmp/composer \
                        -e COMPOSER_PROCESS_TIMEOUT=0 \
                        site-php-cli composer test:integration
                  else
                      PATHS=$(docker compose run --rm -T \
                        --user "$(id -u):$(id -g)" \
                        site-php-cli bin/functional-shard.sh ${{ matrix.shard }} 3 | tr -d '\r')
                      echo "Шард ${{ matrix.shard }} покрывает: $PATHS"
                      docker compose run --rm -T \
                        --user "$(id -u):$(id -g)" \
                        -e COMPOSER_HOME=/tmp/composer \
                        -e COMPOSER_PROCESS_TIMEOUT=0 \
                        site-php-cli php bin/phpunit $PATHS
                  fi

    # 1. ЭТАП СБОРКИ: собираем только затронутые образы (динамическая матрица).
    build-and-push:
        needs: [ changes, unit-tests, cs-check ]
        # !cancelled() — чтобы job стартовал даже когда unit-tests/cs-check пропущены (frontend/landing-only).
        # != 'failure'  — но НЕ собираем, если бэкенд-тесты или проверка стиля упали.
        if: ${{ !cancelled() && needs.changes.result == 'success' && needs.unit-tests.result != 'failure' && needs['cs-check'].result != 'failure' && needs.changes.outputs.matrix != '{"include":[]}' }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
        permissions:
            contents: read
            packages: write
        steps:
            - name: 📦 Checkout repository
              uses: actions/checkout@v6

            - name: 🔐 Login to GHCR
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: 🛠 Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: 🛠 Build and Push ${{ matrix.service }}
              uses: docker/build-push-action@v7
              with:
                  context: ${{ matrix.context }}
                  file: ${{ matrix.file }}
                  push: ${{ github.event_name != 'pull_request' }}
                  tags: |
                      ghcr.io/pavelsur07/${{ matrix.image }}:latest
                      ghcr.io/pavelsur07/${{ matrix.image }}:${{ github.sha }}
                  cache-from: type=gha,scope=${{ matrix.service }}
                  cache-to: type=gha,scope=${{ matrix.service }},mode=max

    # 2. ПРОВЕРКА СХЕМЫ — перед автоматическим или ручным deploy.
    schema-ready:
        name: 🔍 Verify production schema is ready
        needs: [ build-and-push, migrations-empty-db, api-types-check, backend-tests ]
        if: ${{ !cancelled() && github.ref == 'refs/heads/master' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.production_action == 'deploy')) && needs.build-and-push.result == 'success' && needs.migrations-empty-db.result == 'success' && needs.api-types-check.result == 'success' && needs['backend-tests'].result != 'failure' }}
        concurrency:
            group: production-release
            cancel-in-progress: false
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: 🔐 Setup SSH key
              uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
              with:
                  ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

            - name: 🔍 Verify production schema is ready
              run: |
                  ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
                    set -e
                    cd ${{ secrets.SERVER_DIR }}/current

                    export APP_ENV="${{ secrets.APP_ENV }}"
                    export APP_SECRET="${{ secrets.APP_SECRET }}"
                    export DATABASE_URL="${{ secrets.DATABASE_URL }}"
                    export POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}"
                    export SITE_MAILER_DSN="${{ secrets.SITE_MAILER_DSN }}"
                    export SENTRY_DSN="${{ secrets.SENTRY_DSN }}"
                    export SENTRY_RELEASE="${{ github.sha }}"
                    export IMAGE_TAG="${{ github.sha }}"
                    export HEALTH_CHECK_TOKEN="${{ secrets.HEALTH_CHECK_TOKEN }}"
                    export APP_OBJECT_STORAGE_S3_ACCESS_KEY="${{ secrets.APP_OBJECT_STORAGE_S3_ACCESS_KEY }}"
                    export APP_OBJECT_STORAGE_S3_SECRET_KEY="${{ secrets.APP_OBJECT_STORAGE_S3_SECRET_KEY }}"
                    export APP_ENCRYPTION_FALLBACK_KEY="${{ secrets.APP_ENCRYPTION_FALLBACK_KEY }}"
                    export APP_ENCRYPTION_KEYS_JSON='${{ secrets.APP_ENCRYPTION_KEYS_JSON }}'
                    export APP_ENCRYPTION_CURRENT_KEY_VERSION="${{ secrets.APP_ENCRYPTION_CURRENT_KEY_VERSION }}"

                    docker compose -f docker-compose.prod.yml pull site-php-cli
                    docker compose -f docker-compose.prod.yml run --rm --no-deps -T site-php-cli bin/console doctrine:migrations:up-to-date --no-interaction
                  EOF

    # 3. ЭТАП ДЕПЛОЯ (rolling update — минимальный даунтайм).
    #    Автоматически после push в master или вручную через production_action=deploy.
    #    Всегда только после schema-ready.
    deploy:
        needs: schema-ready
        if: ${{ !cancelled() && github.ref == 'refs/heads/master' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.production_action == 'deploy')) && needs.schema-ready.result == 'success' }}
        concurrency:
            group: production-release
            cancel-in-progress: false
        runs-on: ubuntu-latest
        steps:
            - name: 📦 Checkout repository
              uses: actions/checkout@v6

            - name: 🛠 Install zip
              run: sudo apt-get install -y zip

            - name: 🔐 Setup SSH key
              uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
              with:
                  ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

            - name: 📦 Create deploy archive (Configs only)
              run: |
                  zip -r app.zip docker-compose.prod.yml docker/

            - name: 📤 Upload archive to server
              run: |
                  scp -o StrictHostKeyChecking=no app.zip ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.SERVER_DIR }}

            - name: 🚀 Deploy application (rolling update)
              run: |
                  ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
                    set -e
                    cd ${{ secrets.SERVER_DIR }}

                    echo "📦 Распаковка архива"
                    rm -rf ./current
                    mkdir -p ./current
                    unzip -o app.zip -d ./current
                    rm app.zip

                    cd ./current

                    # Экспортируем переменные для docker compose
                    export APP_ENV="${{ secrets.APP_ENV }}"
                    export APP_SECRET="${{ secrets.APP_SECRET }}"
                    export DATABASE_URL="${{ secrets.DATABASE_URL }}"
                    export POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}"
                    export SITE_MAILER_DSN="${{ secrets.SITE_MAILER_DSN }}"
                    export SENTRY_DSN="${{ secrets.SENTRY_DSN }}"
                    export SENTRY_RELEASE="${{ github.sha }}"
                    export IMAGE_TAG="${{ github.sha }}"
                    export HEALTH_CHECK_TOKEN="${{ secrets.HEALTH_CHECK_TOKEN }}"
                    export APP_OBJECT_STORAGE_S3_ACCESS_KEY="${{ secrets.APP_OBJECT_STORAGE_S3_ACCESS_KEY }}"
                    export APP_OBJECT_STORAGE_S3_SECRET_KEY="${{ secrets.APP_OBJECT_STORAGE_S3_SECRET_KEY }}"
                    export APP_ENCRYPTION_FALLBACK_KEY="${{ secrets.APP_ENCRYPTION_FALLBACK_KEY }}"
                    export APP_ENCRYPTION_KEYS_JSON='${{ secrets.APP_ENCRYPTION_KEYS_JSON }}'
                    export APP_ENCRYPTION_CURRENT_KEY_VERSION="${{ secrets.APP_ENCRYPTION_CURRENT_KEY_VERSION }}"
                    # Heartbeat-монитор GlitchTip для scheduler. Секрет не заведён → пусто →
                    # строка крона выключает себя сама по [ -n "$..." ].
                    # См. docs/maintenance/mailer-monitoring.md
                    export GLITCHTIP_SCHEDULER_HEARTBEAT_URL="${{ secrets.GLITCHTIP_SCHEDULER_HEARTBEAT_URL }}"

                    printf 'IMAGE_TAG=%s\n' "$IMAGE_TAG" > .env

                    echo "🚚 Скачивание свежих образов из GHCR"
                    docker compose -f docker-compose.prod.yml pull land site site-php-fpm site-php-cli

                    # ───────────────────────────────────────────────
                    # ROLLING UPDATE: обновляем сервисы в правильном порядке
                    # Порядок: infra → backend → frontend (reverse proxy)
                    # ───────────────────────────────────────────────

                    echo "🐳 [1/5] Обновляем PHP-FPM (бэкенд)"
                    docker compose -f docker-compose.prod.yml up -d --no-deps --wait site-php-fpm
                    echo "✅ site-php-fpm healthy"

                    echo "🐳 [2/5] Обновляем Nginx (фронтенд сайта)"
                    docker compose -f docker-compose.prod.yml up -d --no-deps --wait site
                    echo "✅ site-nginx healthy"

                    echo "🐳 [3/5] Обновляем Landing"
                    docker compose -f docker-compose.prod.yml up -d --no-deps --wait land
                    echo "✅ land healthy"

                    echo "🐳 [4/5] Обновляем воркеры и CLI"
                    docker compose -f docker-compose.prod.yml up -d --no-deps site-php-cli site-messenger-worker-sync site-messenger-worker-pipeline site-messenger-worker-ads scheduler

                    echo "🐳 [5/5] Поднимаем остальные сервисы (если есть новые)"
                    docker compose -f docker-compose.prod.yml up -d --remove-orphans

                    # Проба SMTP из env, который реально запечён в контейнер (письмо не шлём — только AUTH).
                    # Ловит протухший секрет сразу, а не через час кроном. Деплой не валим: мёртвая
                    # почта — не повод красить выкатку несвязанного кода, а logger->error внутри
                    # команды уже заводит issue в GlitchTip.
                    echo "📧 Проверяем SMTP-транспорт"
                    docker compose -f docker-compose.prod.yml exec -T scheduler php bin/console app:mailer:healthcheck --no-interaction \
                      || echo "⚠️ SMTP не отвечает — проверь GitHub secret SITE_MAILER_DSN (см. docs/maintenance/mailer-monitoring.md)"

                    echo "🧹 Очистка старых образов Docker"
                    docker image prune -af --filter "until=336h"
                    echo "✅ Деплой завершён без даунтайма"
                  EOF

    # 4. ЭТАП МИГРАЦИЙ — отдельный ручной gate до deploy нового commit SHA.
    migrations:
        needs: changes
        if: ${{ !cancelled() && needs.changes.result == 'success' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && inputs.production_action == 'migrations' }}
        concurrency:
            group: production-release
            cancel-in-progress: false
        runs-on: ubuntu-latest
        steps:
            - name: 🔐 Setup SSH key
              uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
              with:
                  ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

            - name: 🧬 Run Doctrine migrations
              run: |
                  ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
                    set -e
                    cd ${{ secrets.SERVER_DIR }}/current

                    echo "🚧 Выполняем миграции"
                    export APP_ENV="${{ secrets.APP_ENV }}"
                    export APP_SECRET="${{ secrets.APP_SECRET }}"
                    export DATABASE_URL="${{ secrets.DATABASE_URL }}"
                    export POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}"
                    export SITE_MAILER_DSN="${{ secrets.SITE_MAILER_DSN }}"
                    export SENTRY_DSN="${{ secrets.SENTRY_DSN }}"
                    export SENTRY_RELEASE="${{ github.sha }}"
                    export IMAGE_TAG="${{ github.sha }}"
                    export HEALTH_CHECK_TOKEN="${{ secrets.HEALTH_CHECK_TOKEN }}"
                    export APP_OBJECT_STORAGE_S3_ACCESS_KEY="${{ secrets.APP_OBJECT_STORAGE_S3_ACCESS_KEY }}"
                    export APP_OBJECT_STORAGE_S3_SECRET_KEY="${{ secrets.APP_OBJECT_STORAGE_S3_SECRET_KEY }}"
                    export APP_ENCRYPTION_FALLBACK_KEY="${{ secrets.APP_ENCRYPTION_FALLBACK_KEY }}"
                    export APP_ENCRYPTION_KEYS_JSON='${{ secrets.APP_ENCRYPTION_KEYS_JSON }}'
                    export APP_ENCRYPTION_CURRENT_KEY_VERSION="${{ secrets.APP_ENCRYPTION_CURRENT_KEY_VERSION }}"

                    docker compose -f docker-compose.prod.yml pull site-php-cli
                    docker compose -f docker-compose.prod.yml run --rm --no-deps -T site-php-cli bin/console doctrine:migrations:migrate --no-interaction
                    echo "✅ Миграции применены"
                  EOF

    # 5. ТЕСТЫ НА ПУСТОЙ БД — только при изменении бэкенда.
    migrations-empty-db:
        needs: changes
        if: ${{ needs.changes.outputs.backend == 'true' }}
        runs-on: ubuntu-latest
        services:
            postgres:
                image: postgres:15-alpine
                env:
                    POSTGRES_DB: app
                    POSTGRES_USER: app
                    POSTGRES_PASSWORD: app
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd="pg_isready -U app -d app"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=5
            redis:
                image: redis:7-alpine
                ports:
                    - "6379:6379"
                options: >-
                    --health-cmd="redis-cli ping"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=10

        steps:
            - name: 📦 Checkout repository
              uses: actions/checkout@v6

            - name: 🐘 Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  tools: composer

            - name: 📦 Install dependencies
              working-directory: site
              run: composer install --no-interaction --prefer-dist --no-progress --no-scripts

            - name: 🧬 Run Doctrine migrations
              working-directory: site
              env:
                  APP_ENV: test
                  APP_DEBUG: 0
                  DATABASE_URL: "pgsql://app:app@127.0.0.1:5432/app?serverVersion=15&charset=utf8"
                  REDIS_DSN: "redis://127.0.0.1:6379"
                  MESSENGER_TRANSPORT_DSN: "redis://127.0.0.1:6379/messages"
              run: php bin/console doctrine:migrations:migrate --no-interaction

    # 6. ПРОВЕРКА СИНХРОНИЗАЦИИ API-ТИПОВ — при изменении бэкенда или фронта.
    api-types-check:
        name: 🔍 Check API types sync
        needs: changes
        if: ${{ needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' }}
        runs-on: ubuntu-latest
        services:
            postgres:
                image: postgres:15-alpine
                env:
                    POSTGRES_DB: app
                    POSTGRES_USER: app
                    POSTGRES_PASSWORD: app
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd="pg_isready -U app -d app"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=5
            redis:
                image: redis:7-alpine
                ports:
                    - "6379:6379"
                options: >-
                    --health-cmd="redis-cli ping"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=10

        steps:
            - name: 📦 Checkout repository
              uses: actions/checkout@v6

            - name: 🐘 Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  tools: composer

            - name: 📦 Install PHP dependencies
              working-directory: site
              run: composer install --no-interaction --prefer-dist --no-progress --no-scripts

            - name: 📦 Setup Node
              uses: actions/setup-node@v6
              with:
                  node-version: '24'
                  cache: 'yarn'
                  cache-dependency-path: site/yarn.lock

            - name: 📦 Install Node dependencies
              working-directory: site
              run: yarn install --frozen-lockfile

            - name: 🧬 Generate OpenAPI spec
              working-directory: site
              env:
                  APP_ENV: dev
                  APP_DEBUG: 0
                  DATABASE_URL: "pgsql://app:app@127.0.0.1:5432/app?serverVersion=15&charset=utf8"
                  REDIS_DSN: "redis://127.0.0.1:6379"
                  MESSENGER_TRANSPORT_DSN: "redis://127.0.0.1:6379/messages"
              run: |
                  mkdir -p var
                  php bin/console nelmio:apidoc:dump --format=json > var/openapi.json

            - name: 🔍 Check TypeScript schema is up to date
              working-directory: site
              run: |
                  npx openapi-typescript var/openapi.json -o /tmp/schema.check.d.ts
                  if ! diff -q /tmp/schema.check.d.ts assets/api/schema.d.ts > /dev/null; then
                      echo "::error::site/assets/api/schema.d.ts is out of sync with OpenAPI spec"
                      echo ""
                      echo "The committed TypeScript schema does not match what would be generated from the current backend code."
                      echo ""
                      echo "To fix: run 'make api-types' locally and commit the updated site/assets/api/schema.d.ts"
                      echo ""
                      echo "Diff:"
                      diff /tmp/schema.check.d.ts assets/api/schema.d.ts || true
                      exit 1
                  fi
                  echo "✅ schema.d.ts is in sync with OpenAPI spec"
