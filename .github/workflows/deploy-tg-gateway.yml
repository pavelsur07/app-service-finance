name: 🚀 Deploy TG Gateway

on:
    workflow_dispatch:

    push:
        branches: [ master ]
        paths:
            - 'tg-gateway/**'
            - '.github/workflows/deploy-tg-gateway.yml'

jobs:
    deploy-tg-gateway:
        name: 🚀 Deploy tg.vashfindir.ru gateway
        runs-on: ubuntu-latest

        steps:
            - name: 📦 Checkout repository
              uses: actions/checkout@v4

            - name: 🔐 Setup SSH key
              uses: webfactory/ssh-agent@v0.8.0
              with:
                  ssh-private-key: ${{ secrets.TG_SSH_PRIVATE_KEY }}

            - name: 📤 Upload nginx site
              run: |
                  scp -o StrictHostKeyChecking=no \
                    tg-gateway/nginx/tg.vashfindir.ru.conf \
                    ${{ secrets.TG_SERVER_USER }}@${{ secrets.TG_SERVER_HOST }}:/tmp/tg-gateway.conf

            - name: 🚀 Install site and reload nginx
              run: |
                  ssh -o StrictHostKeyChecking=no \
                    ${{ secrets.TG_SERVER_USER }}@${{ secrets.TG_SERVER_HOST }} << 'EOF'
                      set -e

                      if [ ! -f /etc/letsencrypt/live/tg.vashfindir.ru/fullchain.pem ]; then
                          echo "❌ Нет сертификата tg.vashfindir.ru: certbot certonly --nginx -d tg.vashfindir.ru"
                          exit 1
                      fi

                      SITE=/etc/nginx/sites-available/tg-gateway
                      BACKUP=$(mktemp)
                      [ -f "$SITE" ] && cp "$SITE" "$BACKUP" || : > "$BACKUP"

                      install -m 0644 /tmp/tg-gateway.conf "$SITE"
                      rm -f /tmp/tg-gateway.conf
                      ln -sfn "$SITE" /etc/nginx/sites-enabled/tg-gateway

                      if ! nginx -t; then
                          echo "❌ nginx -t не прошёл — возвращаю прежний конфиг"
                          if [ -s "$BACKUP" ]; then cp "$BACKUP" "$SITE"; else rm -f "$SITE" /etc/nginx/sites-enabled/tg-gateway; fi
                          rm -f "$BACKUP"
                          exit 1
                      fi
                      rm -f "$BACKUP"

                      systemctl reload nginx

                      echo "🔍 Проверки"
                      curl -fsS -m 10 --resolve tg.vashfindir.ru:443:127.0.0.1 https://tg.vashfindir.ru/health && echo ""
                      curl -s -m 10 -o /dev/null -w "upstream app.vashfindir.ru: %{http_code}\n" https://app.vashfindir.ru/telegram/webhook
                      curl -s -m 10 -o /dev/null -w "api.telegram.org: %{http_code}\n" https://api.telegram.org/

                      echo "✅ tg-gateway deploy completed"
                  EOF
