name: Frontend Lint

on:
  pull_request:
    paths:
      - 'site/assets/**'
      - 'site/packages/**'
      - 'site/.eslintrc.cjs'
      - 'site/package.json'
      - 'site/yarn.lock'
      - 'site/vitest.config.ts'
      - '.github/workflows/frontend-lint.yml'
  push:
    branches: [master]

jobs:
  eslint-boundaries:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'yarn'
          cache-dependency-path: site/yarn.lock
      - run: yarn install --frozen-lockfile
      - run: npx eslint 'assets/**/*.{ts,tsx,js,jsx}'
      # Чистая логика фронта (vitest, `assets/**/*.test.ts`), CLAUDE.frontend.md «Гейты».
      - run: yarn test:unit
