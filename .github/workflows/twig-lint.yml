name: Twig Lint

# Гейт Twig-шаблонов: twigcs (site/.twigcs.php, ruleset site/tests/Twigcs/Ruleset.php)
# и lint:twig (компиляция всех шаблонов). Отдельный workflow, не в цепочке deploy.yml:
# красный результат не трогает деплой. Конвенции — docs/workflow/twig-conventions.md.
on:
  pull_request:
    paths:
      - 'site/templates/**'
      - 'site/.twigcs.php'
      - 'site/tests/Twigcs/**'
      - 'site/src/Twig/**'
      - '.github/workflows/twig-lint.yml'
  push:
    branches: [master]

jobs:
  twig-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer
          coverage: none

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: site/vendor
          key: composer-${{ hashFiles('site/composer.lock') }}
          restore-keys: composer-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts

      - name: twigcs
        run: composer cs:twig

      - name: lint:twig
        env:
          APP_ENV: test
          APP_DEBUG: 0
          APP_SECRET: test
          DEFAULT_URI: http://localhost
        run: php bin/console lint:twig templates
