# Формат access log шлюза (http-контекст). Ставится в /etc/nginx/conf.d/ —
# объявлен один раз на хост, до сайтов, которые на него ссылаются.
# Путь без query ($uri), без заголовков авторизации и тел.
log_format gateway_json escape=json
    '{"time":"$time_iso8601","host":"$host","method":"$request_method",'
    '"path":"$uri","status":$status,"upstream_status":"$upstream_status",'
    '"request_time":$request_time,"upstream_response_time":"$upstream_response_time",'
    '"bytes_sent":$body_bytes_sent,"remote_addr":"$remote_addr"}';
