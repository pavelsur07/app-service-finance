# Шлюз провайдеров ИИ ai.vashfindir.ru — ИСТОЧНИК ПРАВДЫ, устройство — gateway/README.md.
# На хосте: /etc/nginx/sites-available/ai-gateway (+ symlink), ставит deploy-gateway.yml.
#
# ai-service (app 217.198.13.171) → /{openai|deepseek|kimi}/<путь> с Authorization: Bearer <токен шлюза>
# → провайдер с его ключом. Ключи и токены — /etc/nginx/gateway-secrets.conf (root 0600,
# собирает scripts/render-secrets.sh): $ai_client_ok, $ai_openai_key, $ai_deepseek_key, $ai_kimi_key.

include /etc/nginx/gateway-secrets.conf;

# Пути провайдеров — для проверки входа в server (snippets/gateway/ai-gate.conf).
map $uri $ai_provider_path {
    "~^/(openai|deepseek|kimi)/" 1;
    default 0;
}

# Страховка от всплеска расходов: на провайдера, не на клиента.
limit_req_zone $server_name zone=ai_openai:1m rate=10r/s;
limit_req_zone $server_name zone=ai_deepseek:1m rate=10r/s;
limit_req_zone $server_name zone=ai_kimi:1m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name ai.vashfindir.ru;
    server_tokens off;

    # Свои журналы и на 80: иначе пишет журнал хоста по умолчанию — с query и Referer.
    access_log /var/log/nginx/ai-gateway.access.log gateway_json;
    error_log /var/log/nginx/ai-gateway.error.log warn;

    location = /health {
        default_type text/plain;
        return 200 'alive';
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ai.vashfindir.ru;
    charset utf-8;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/ai.vashfindir.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai.vashfindir.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # systemd-resolved: proxy_pass с переменной резолвит имя на каждый запрос,
    # недоступный DNS провайдера не мешает reload.
    resolver 127.0.0.53 ipv6=off valid=30s;

    access_log /var/log/nginx/ai-gateway.access.log gateway_json;
    error_log /var/log/nginx/ai-gateway.error.log warn;

    default_type application/json;
    include /etc/nginx/snippets/gateway/ai-gate.conf;

    client_max_body_size 1m;
    limit_req_status 429;

    proxy_connect_timeout 5s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
    proxy_buffering off;
    proxy_http_version 1.1;

    location = /health {
        default_type text/plain;
        return 200 'alive';
    }

    location /openai/ {
        if ($ai_openai_key = "") {
            return 503 '{"error":{"code":"provider_not_configured","message":"Provider is not configured on the gateway"}}';
        }
        limit_req zone=ai_openai burst=20 nodelay;

        set $ai_upstream https://api.openai.com;
        rewrite ^/openai/(.*)$ /$1 break;
        proxy_pass $ai_upstream;

        include /etc/nginx/snippets/gateway/upstream-tls.conf;
        include /etc/nginx/snippets/gateway/ai-upstream.conf;
        proxy_ssl_name api.openai.com;
        proxy_set_header Host api.openai.com;
        proxy_set_header Authorization "Bearer $ai_openai_key";
    }

    location /deepseek/ {
        if ($ai_deepseek_key = "") {
            return 503 '{"error":{"code":"provider_not_configured","message":"Provider is not configured on the gateway"}}';
        }
        limit_req zone=ai_deepseek burst=20 nodelay;

        set $ai_upstream https://api.deepseek.com;
        rewrite ^/deepseek/(.*)$ /$1 break;
        proxy_pass $ai_upstream;

        include /etc/nginx/snippets/gateway/upstream-tls.conf;
        include /etc/nginx/snippets/gateway/ai-upstream.conf;
        proxy_ssl_name api.deepseek.com;
        proxy_set_header Host api.deepseek.com;
        proxy_set_header Authorization "Bearer $ai_deepseek_key";
    }

    location /kimi/ {
        if ($ai_kimi_key = "") {
            return 503 '{"error":{"code":"provider_not_configured","message":"Provider is not configured on the gateway"}}';
        }
        limit_req zone=ai_kimi burst=20 nodelay;

        set $ai_upstream https://api.moonshot.ai;
        rewrite ^/kimi/(.*)$ /$1 break;
        proxy_pass $ai_upstream;

        include /etc/nginx/snippets/gateway/upstream-tls.conf;
        include /etc/nginx/snippets/gateway/ai-upstream.conf;
        proxy_ssl_name api.moonshot.ai;
        proxy_set_header Host api.moonshot.ai;
        proxy_set_header Authorization "Bearer $ai_kimi_key";
    }

    # Без слэша nginx сам ответил бы 301 на /<провайдер>/ — не подсказываем пути.
    # Только точное совпадение: авто-редирект срабатывает раньше регулярных location.
    location = /openai { return 404; }
    location = /deepseek { return 404; }
    location = /kimi { return 404; }

    location / {
        return 404;
    }
}
