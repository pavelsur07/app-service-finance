# Шлюз Telegram tg.vashfindir.ru — ИСТОЧНИК ПРАВДЫ.
# Хост 109.73.204.179: системный nginx, рядом живёт mybots.vashfindir.ru (его не трогать).
# .github/workflows/deploy-gateway.yml ставит файл в /etc/nginx/sites-available/tg-gateway
# (+ symlink в sites-enabled) вместе со сниппетами, делает nginx -t и reload.
# Ручные правки на сервере перезапишутся. Устройство — gateway/README.md.
# Сертификат выпускается один раз: certbot certonly --nginx -d tg.vashfindir.ru;
# продлевает certbot.timer, конфиг certbot не правит.
#
# Вход: Telegram → /telegram/webhook → app.vashfindir.ru.
# Выход: app (217.198.13.171) → /bot-api/ → api.telegram.org (у app-сервера нет прямого доступа).

server {
    listen 80;
    listen [::]:80;
    server_name tg.vashfindir.ru;
    server_tokens off;

    location = /health {
        default_type text/plain;
        return 200 'alive';
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name tg.vashfindir.ru;
    charset utf-8;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/tg.vashfindir.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tg.vashfindir.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # systemd-resolved: proxy_pass с переменной резолвит имя на каждый запрос
    resolver 127.0.0.53 ipv6=off valid=30s;

    access_log /var/log/nginx/tg-gateway.access.log gateway_json;
    error_log /var/log/nginx/tg-gateway.error.log warn;

    client_max_body_size 5m;

    location = /health {
        default_type text/plain;
        return 200 'alive';
    }

    location = /telegram/webhook {
        set $app_upstream https://app.vashfindir.ru;

        proxy_pass $app_upstream/telegram/webhook;

        include /etc/nginx/snippets/gateway/upstream-tls.conf;
        proxy_ssl_name app.vashfindir.ru;

        proxy_set_header Host app.vashfindir.ru;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        proxy_buffering off;

        proxy_intercept_errors on;
        error_page 502 503 504 = @upstream_error;
    }

    # Только app-сервер; токен бота лежит в URL — ни в access, ни в error log
    # (ошибки upstream пишут исходный запрос). Сбои видны на стороне app.
    location /bot-api/ {
        include /etc/nginx/snippets/gateway/app-only.conf;

        access_log off;
        error_log /dev/null;

        set $tg_api https://api.telegram.org;
        # /bot-api/botXXX/method -> https://api.telegram.org/botXXX/method (в т.ч. /file/botXXX/...)
        rewrite ^/bot-api/(.*)$ /$1 break;
        proxy_pass $tg_api;

        include /etc/nginx/snippets/gateway/upstream-tls.conf;
        proxy_ssl_name api.telegram.org;
        proxy_set_header Host api.telegram.org;

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        proxy_buffering off;
    }

    location @upstream_error {
        default_type application/json;
        return 502 '{"error":{"code":"upstream_unavailable","message":"Gateway upstream error"}}';
    }

    location / {
        return 404;
    }
}
