# Токен клиента шлюза ИИ ($ai_client_ok — map из /etc/nginx/gateway-secrets.conf).
# Подключается после app-only.conf: чужой IP получает 403 раньше этой проверки.
default_type application/json;
if ($ai_client_ok = 0) {
    return 401 '{"error":{"code":"unauthorized","message":"Gateway token is missing or invalid"}}';
}
