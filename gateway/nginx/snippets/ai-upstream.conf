# Заголовки запроса к провайдеру ИИ и его ответа. В location, а не в server:
# proxy_set_header из server не наследуется в location со своими proxy_set_header.
# Провайдеру не уходят идентификаторы клиента и организации; Host и Authorization
# (ключ провайдера вместо токена шлюза) задаёт location.
# Ошибки nginx (413, 429, сбой upstream) пишут строку запроса с query — в error
# log не пишем; диагностика — access log (status, upstream_status, request_time).
error_log /dev/null;
proxy_set_header Cookie "";
proxy_set_header X-Forwarded-For "";
proxy_set_header X-Real-IP "";
proxy_set_header OpenAI-Organization "";
proxy_set_header OpenAI-Project "";
proxy_set_header Connection "";
proxy_hide_header Set-Cookie;
proxy_hide_header openai-organization;
proxy_hide_header openai-project;
