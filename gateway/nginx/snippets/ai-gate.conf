# Вход к провайдерам ИИ: чужой IP → 403, затем токен ($ai_client_ok из
# /etc/nginx/gateway-secrets.conf) → 401. Подключается в server, а не в location:
# фаза server rewrite идёт до выбора location, где nginx уже проверяет размер
# тела (413) — иначе чужой IP или запрос без токена получили бы 413.
# IP app — conf.d/gateway-app.conf; пути провайдеров — $ai_provider_path.
set $ai_gate "$ai_provider_path:$gateway_from_app:$ai_client_ok";
if ($ai_gate ~ "^1:0:") {
    return 403;
}
if ($ai_gate = "1:1:0") {
    return 401 '{"error":{"code":"unauthorized","message":"Gateway token is missing or invalid"}}';
}
