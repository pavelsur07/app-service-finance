# Доступ только с app-сервера (IP — conf.d/gateway-app.conf).
# if/return, а не allow/deny: срабатывает в фазе rewrite — раньше проверки токена,
# поэтому чужой IP получает 403 без подсказки про токен; и не пишет в error log
# строку «access forbidden» с путём запроса (у /bot-api/ в пути токен бота).
if ($gateway_from_app = 0) {
    return 403;
}
