x-logging: &default-logging
    driver: "json-file"
    options:
        max-size: "10m"
        max-file: "3"

# ───────────────────────────────────────────────────────────────
# Общий блок переменных окружения для PHP-сервисов (DRY)
# ───────────────────────────────────────────────────────────────
x-php-env: &php-env
    TZ: Europe/Moscow
    DATABASE_URL: pgsql://app:${POSTGRES_PASSWORD}@site-postgres:5432/app
    APP_ENV: prod
    APP_SECRET: ${APP_SECRET}
    REDIS_DSN: redis://site-redis:6379
    MESSENGER_TRANSPORT_DSN: redis://site-redis:6379/messages
    MESSENGER_TRANSPORT_DSN_SYNC: redis://site-redis:6379/messages_sync
    MESSENGER_TRANSPORT_DSN_PIPELINE: redis://site-redis:6379/messages_pipeline
    MESSENGER_TRANSPORT_DSN_ADS: redis://site-redis:6379/messages_ads
    MESSENGER_TRANSPORT_DSN_WB_FINANCE: redis://site-redis:6379/messages_wb_finance
    MAILER_DSN: ${SITE_MAILER_DSN}
    SENTRY_DSN: ${SENTRY_DSN}
    # Релиз для GlitchTip — git sha из деплоя. Пусто = релиз-трекинг выключен (безопасно).
    SENTRY_RELEASE: ${SENTRY_RELEASE:-}
    # Ключ шифрования api_key подключений маркетплейсов (sodium secretbox, base64 32 байта).
    # Пусто = encrypt-путь упадёт с MissingEncryptionKeyException при записи подключений.
    APP_ENCRYPTION_FALLBACK_KEY: ${APP_ENCRYPTION_FALLBACK_KEY:-}
    # Карта версий ключей для ротации (JSON в одинарных кавычках) и активная версия.
    APP_ENCRYPTION_KEYS_JSON: ${APP_ENCRYPTION_KEYS_JSON:-}
    APP_ENCRYPTION_CURRENT_KEY_VERSION: ${APP_ENCRYPTION_CURRENT_KEY_VERSION:-v1}
    # BankSync, Альфа: канал mTLS и вход Alfa ID песочницы (docs/tasks/bank-sync/alfa-demo.md).
    # Пусто = Альфа не настроена (кнопок входа нет, гейт сертификатов — «не настроено»).
    ALFA_TLS_CERT_PATH: ${ALFA_TLS_CERT_PATH:-}
    ALFA_TLS_KEY_PATH: ${ALFA_TLS_KEY_PATH:-}
    ALFA_TLS_KEY_PASSPHRASE: ${ALFA_TLS_KEY_PASSPHRASE:-}
    ALFA_SANDBOX_CLIENT_ID: ${ALFA_SANDBOX_CLIENT_ID:-}
    ALFA_SANDBOX_CLIENT_SECRET: ${ALFA_SANDBOX_CLIENT_SECRET:-}
    ALFA_SANDBOX_ID_SIGNING_CERT_PATH: ${ALFA_SANDBOX_ID_SIGNING_CERT_PATH:-}
    HEALTH_CHECK_TOKEN: ${HEALTH_CHECK_TOKEN}
    APP_MAIL_FROM: "Ваш Финдир <support@vashfindir.ru>"
    APP_MAIL_REPLY_TO: "support@vashfindir.ru"
    FEATURE_FUNDS_AND_WIDGET: ${FEATURE_FUNDS_AND_WIDGET:-1}
    WB_LEGACY_RECONCILE_ENABLED: ${WB_LEGACY_RECONCILE_ENABLED:-0}
    # Диагностика производительности Marketplace M1 (структурированные замеры этапов →
    # var/log/performance-<дата>.jsonl в томе site_var_log, отчёт app:marketplace:perf-report).
    # Выключить: MARKETPLACE_PERF_DIAGNOSTICS=0 в host-env и пересоздать PHP-контейнеры (флаг
    # читается при старте процесса). В scheduler не пробрасывается намеренно: у него нет тома
    # site_var_log, а cron-команды лишь ставят сообщения — их обработка замеряется в воркерах.
    # См. docs/architecture/marketplace-audit/09-m1-diagnostics.md.
    MARKETPLACE_PERF_DIAGNOSTICS: ${MARKETPLACE_PERF_DIAGNOSTICS:-1}
    LLM_API_URL: "https://example.com/v1/chat/completions"
    LLM_API_KEY: "change-me"
    # Публичный URL вебхука Telegram — точка приёма апдейтов (шлюз tg-gateway)
    TELEGRAM_WEBHOOK_URL: ${TELEGRAM_WEBHOOK_URL:-https://tg.vashfindir.ru/telegram/webhook}
    # Секрет вебхука: задать случайным значением в host-env и переустановить webhook (пусто = проверка выключена)
    TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
    # Базовый URL Telegram Bot API через шлюз tg-gateway (app-сервер не имеет прямого доступа к api.telegram.org)
    TELEGRAM_API_BASE_URL: ${TELEGRAM_API_BASE_URL:-https://tg.vashfindir.ru/bot-api}
    # ─── Объектное хранилище файлов (timeweb S3) ───────────────────────────
    # Флип выполнен после `aws s3 sync` (данные уже в бакете). Откат — вернуть `local`
    # (локальный том сохранён как холодный бэкап на грейс-период). Менять в ДВУХ местах
    # (здесь и в блоке scheduler).
    APP_OBJECT_STORAGE_DRIVER: s3
    APP_OBJECT_STORAGE_S3_ENDPOINT: "https://s3.twcstorage.ru"
    APP_OBJECT_STORAGE_S3_BUCKET: "ccd24eb8-1c82-4de4-bd69-9706a7b5443b"
    APP_OBJECT_STORAGE_S3_REGION: "ru-1"
    # Если бакет не резолвится virtual-hosted стилем — переключить на "1" (path-style)
    APP_OBJECT_STORAGE_S3_PATH_STYLE_ENDPOINT: "0"
    # ─── Внутренний API /internal/* для сервисов services/ (ozon-fetcher) ───
    # Пустой токен — /internal/* закрыт для всех (fail-closed), пока секрет не заведён.
    # Allowlist — docker-сети хоста: внешний клиент через traefik приходит с публичным
    # IP и с X-Forwarded-For (nginx отдаёт 404). См. docs/maintenance/ozon-fetcher-prod.md.
    INTERNAL_AUTH_TOKEN: ${INTERNAL_AUTH_TOKEN:-}
    INTERNAL_ALLOWED_IPS: "172.16.0.0/12"
    # Ключи — только через GitHub Secrets (deploy.yml экспортирует их в host-env)
    APP_OBJECT_STORAGE_S3_ACCESS_KEY: ${APP_OBJECT_STORAGE_S3_ACCESS_KEY:-}
    APP_OBJECT_STORAGE_S3_SECRET_KEY: ${APP_OBJECT_STORAGE_S3_SECRET_KEY:-}

services:

    traefik:
        image: traefik:3.3
        container_name: traefik
        restart: always
        logging: *default-logging
        environment:
            - TZ=Europe/Moscow
        command:
            - --api.dashboard=true
            - --api.insecure=true
            - --providers.docker=true
            - --providers.docker.exposedByDefault=false
            - --entrypoints.http.address=:80
            - --entrypoints.https.address=:443
            - --certificatesresolvers.letsEncrypt.acme.httpChallenge=true
            - --certificatesresolvers.letsEncrypt.acme.httpChallenge.entryPoint=http
            - --certificatesresolvers.letsEncrypt.acme.email=support@vashfindir.ru
            - --certificatesresolvers.letsEncrypt.acme.storage=/certs/acme.json
            - --log.level=INFO
            # ⬇️ FIX: Traefik будет считать контейнер «живым» только после прохождения healthcheck
            - --providers.docker.defaultRule=
        ports:
            - "80:80"
            - "443:443"
            - "127.0.0.1:8080:8080"
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock:ro
            - traefik-certs:/certs
        networks:
            - traefik-public
        labels:
            - traefik.enable=true

            # Глобальный роутер HTTP -> HTTPS
            - traefik.http.routers.http-catchall.rule=Host(`app.vashfindir.ru`)
            - traefik.http.routers.http-catchall.entrypoints=http
            - traefik.http.routers.http-catchall.middlewares=redirect-to-https
            - traefik.http.routers.http-catchall.priority=1

            - traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https
            - traefik.http.middlewares.redirect-to-https.redirectscheme.permanent=true

    land:
        image: ghcr.io/pavelsur07/land-nginx:${IMAGE_TAG:-latest}
        container_name: land-nginx
        restart: always
        logging: *default-logging
        environment:
            - TZ=Europe/Moscow
        expose:
            - "80"
        networks:
            - traefik-public
            - default
        # ⬇️ FIX: healthcheck для landing nginx
        healthcheck:
            test: ["CMD", "curl", "-f", "http://127.0.0.1/"]
            interval: 5s
            timeout: 3s
            retries: 5
            start_period: 5s
        labels:
            - traefik.enable=true
            - traefik.http.routers.land.rule=Host(`link.vashfindir.ru`)
            - traefik.http.routers.land.entrypoints=https
            - traefik.http.routers.land.tls=true
            - traefik.http.routers.land.tls.certresolver=letsEncrypt
            - traefik.http.services.land.loadbalancer.server.port=80
            - traefik.http.routers.land-http.rule=Host(`link.vashfindir.ru`)
            - traefik.http.routers.land-http.entrypoints=http
            - traefik.http.routers.land-http.middlewares=redirect-to-https
            - traefik.http.routers.land-http.priority=10
            - traefik.docker.network=traefik-public

    site:
        image: ghcr.io/pavelsur07/site-nginx:${IMAGE_TAG:-latest}
        container_name: site-nginx
        restart: always
        logging: *default-logging
        environment:
            - TZ=Europe/Moscow
        depends_on:
            site-php-fpm:
                # ⬇️ FIX: Nginx стартует ТОЛЬКО когда PHP-FPM прошёл healthcheck (отвечает на /ping)
                condition: service_healthy
        expose:
            - "80"
        networks:
            - traefik-public
            - default
        # ⬇️ FIX: healthcheck для site nginx — /health возвращает 200
        healthcheck:
            test: ["CMD", "curl", "-f", "http://127.0.0.1/health"]
            interval: 5s
            timeout: 3s
            retries: 5
            start_period: 10s
        labels:
            - traefik.enable=true
            - traefik.http.routers.myapp.rule=Host(`app.vashfindir.ru`)
            - traefik.http.routers.myapp.entrypoints=https
            - traefik.http.routers.myapp.tls=true
            - traefik.http.routers.myapp.tls.certresolver=letsEncrypt
            - traefik.http.services.myapp.loadbalancer.server.port=80
            - traefik.http.routers.myapp-http.rule=Host(`app.vashfindir.ru`)
            - traefik.http.routers.myapp-http.entrypoints=http
            - traefik.http.routers.myapp-http.middlewares=redirect-to-https
            - traefik.http.routers.myapp-http.priority=10
            - traefik.docker.network=traefik-public
        volumes:
            - site_storage:/app/var/storage

    site-php-fpm:
        image: ghcr.io/pavelsur07/site-php-fpm:${IMAGE_TAG:-latest}
        container_name: site-php-fpm
        restart: always
        logging: *default-logging
        environment:
            <<: *php-env
        networks:
            - default
        depends_on:
            site-postgres:
                # ⬇️ FIX: PHP-FPM ждёт, пока Postgres пройдёт healthcheck
                condition: service_healthy
            site-redis:
                # ⬇️ FIX: PHP-FPM ждёт, пока Redis пройдёт healthcheck
                condition: service_healthy
        volumes:
            # Сертификаты канала и подписи Альфы (BankSync) — вне образа и git, только чтение.
            # Каталог на хосте — ${SERVER_DIR}/shared/alfa, его создаёт деплой (пустой = Альфа не настроена).
            - ${ALFA_SECRETS_DIR:-./alfa-secrets}:/app/var/secrets/alfa:ro
            - site_storage:/app/var/storage
            - site_company_storage:/app/var/storage/companies
            - site_var_log:/app/var/log
        # ⬇️ FIX: увеличен start_period — даём время на cache:warmup при первом старте
        healthcheck:
            test: ["CMD-SHELL", "REDIRECT_STATUS=true SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 || exit 1"]
            interval: 5s
            timeout: 3s
            retries: 10
            start_period: 30s
        # ⬇️ FIX: Даём контейнеру 30 секунд на graceful shutdown (дождаться завершения текущих запросов)
        stop_grace_period: 30s
        deploy:
            resources:
                limits:
                    memory: 800M
                reservations:
                    memory: 128M

    site-php-cli:
        image: ghcr.io/pavelsur07/site-php-cli:${IMAGE_TAG:-latest}
        container_name: site-php-cli
        logging: *default-logging
        environment:
            <<: *php-env
        networks:
            - default
        depends_on:
            site-postgres:
                condition: service_healthy
            site-redis:
                condition: service_healthy
        volumes:
            # Сертификаты канала и подписи Альфы (BankSync) — вне образа и git, только чтение.
            # Каталог на хосте — ${SERVER_DIR}/shared/alfa, его создаёт деплой (пустой = Альфа не настроена).
            - ${ALFA_SECRETS_DIR:-./alfa-secrets}:/app/var/secrets/alfa:ro
            - site_storage:/app/var/storage
            - site_company_storage:/app/var/storage/companies
            - site_var_log:/app/var/log
        # Единственный PHP-сервис без лимита памяти был единственным, чей OOM
        # зависел от состояния всего хоста, а не своего cgroup — ad-hoc команды
        # (app:ingestion:ozon-accrual:daily-maintenance --execute и подобные)
        # порождают подпроцессы с собственным memory_limit=1024M
        # (docker/common/php/conf.d/memory-limit.ini); 1536M — этот подпроцесс
        # плюс родительский PHP-процесс и заметный запас, а не произвольное
        # число. См. docs/tasks/ozon-accrual-refresh-oom/task.md.
        deploy:
            resources:
                limits:
                    memory: 1536M
                reservations:
                    memory: 128M

    site-messenger-worker-sync:
        image: ghcr.io/pavelsur07/site-php-cli:${IMAGE_TAG:-latest}
        container_name: site-messenger-worker-sync
        restart: always
        logging: *default-logging
        command: php bin/console messenger:consume async_sync -vv --time-limit=3600 --memory-limit=160M
        environment:
            <<: *php-env
        networks:
            - default
        depends_on:
            site-postgres:
                condition: service_healthy
            site-redis:
                condition: service_healthy
        volumes:
            # Сертификаты канала и подписи Альфы (BankSync) — вне образа и git, только чтение.
            # Каталог на хосте — ${SERVER_DIR}/shared/alfa, его создаёт деплой (пустой = Альфа не настроена).
            - ${ALFA_SECRETS_DIR:-./alfa-secrets}:/app/var/secrets/alfa:ro
            - site_storage:/app/var/storage
            - site_company_storage:/app/var/storage/companies
            - site_var_log:/app/var/log
        stop_grace_period: 60s
        healthcheck:
            test: ["CMD-SHELL", "ps aux | grep 'messenger:consume async_sync' | grep -v grep"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 10s
        deploy:
            resources:
                limits:
                    memory: 256M
                reservations:
                    memory: 64M

    site-messenger-worker-pipeline:
        image: ghcr.io/pavelsur07/site-php-cli:${IMAGE_TAG:-latest}
        container_name: site-messenger-worker-pipeline
        restart: always
        logging: *default-logging
        command: php bin/console messenger:consume async_pipeline -vv --time-limit=3600 --memory-limit=500M
        environment:
            <<: *php-env
        networks:
            - default
        depends_on:
            site-postgres:
                condition: service_healthy
            site-redis:
                condition: service_healthy
        volumes:
            - site_storage:/app/var/storage
            - site_company_storage:/app/var/storage/companies
            - site_var_log:/app/var/log
        stop_grace_period: 60s
        healthcheck:
            test: ["CMD-SHELL", "ps aux | grep 'messenger:consume async_pipeline' | grep -v grep"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 10s
        deploy:
            resources:
                limits:
                    memory: 768M
                reservations:
                    memory: 192M

    site-messenger-worker-wb-finance:
        image: ghcr.io/pavelsur07/site-php-cli:${IMAGE_TAG:-latest}
        container_name: site-messenger-worker-wb-finance
        restart: always
        logging: *default-logging
        command: php bin/console messenger:consume async_wb_finance --time-limit=3600 --memory-limit=256M --sleep=5 --no-interaction
        environment:
            <<: *php-env
        networks:
            - default
        depends_on:
            site-postgres:
                condition: service_healthy
            site-redis:
                condition: service_healthy
        volumes:
            - site_storage:/app/var/storage
            - site_company_storage:/app/var/storage/companies
            - site_var_log:/app/var/log
        stop_grace_period: 60s
        healthcheck:
            test: ["CMD-SHELL", "ps aux | grep 'messenger:consume async_wb_finance' | grep -v grep"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 10s
        deploy:
            resources:
                limits:
                    memory: 256M
                reservations:
                    memory: 64M

    site-messenger-worker-ads:
        image: ghcr.io/pavelsur07/site-php-cli:${IMAGE_TAG:-latest}
        container_name: site-messenger-worker-ads
        restart: always
        logging: *default-logging
        # --time-limit=3600 means the worker restarts mid-poll at worst once/hour;
        # Messenger redelivers the in-flight message automatically.
        command: php bin/console messenger:consume async_ads -vv --time-limit=3600 --memory-limit=160M
        environment:
            <<: *php-env
        networks:
            - default
        depends_on:
            site-postgres:
                condition: service_healthy
            site-redis:
                condition: service_healthy
        volumes:
            - site_storage:/app/var/storage
            - site_company_storage:/app/var/storage/companies
            - site_var_log:/app/var/log
        # Ads handler can poll up to 10 min; give it more time to finish gracefully.
        stop_grace_period: 120s
        healthcheck:
            test: ["CMD-SHELL", "ps aux | grep 'messenger:consume async_ads' | grep -v grep"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 10s
        deploy:
            resources:
                limits:
                    memory: 256M
                reservations:
                    memory: 64M

    site-postgres:
        image: postgres:15-alpine
        container_name: symfony-postgres
        restart: always
        logging: *default-logging
        environment:
            TZ: Europe/Moscow
            POSTGRES_DB: app
            POSTGRES_USER: app
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        command: >
            postgres 
            -c shared_buffers=1GB 
            -c effective_cache_size=3GB 
            -c work_mem=16MB 
            -c maintenance_work_mem=256MB
        volumes:
            - postgres_data:/var/lib/postgresql/data
        networks:
            - default
        # ⬇️ FIX: Добавлен healthcheck (без него depends_on condition: service_healthy не работает)
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U app -d app"]
            interval: 5s
            timeout: 3s
            retries: 10
            start_period: 10s

    site-redis:
        image: redis:7-alpine
        container_name: site-redis
        restart: always
        logging: *default-logging
        environment:
            - TZ=Europe/Moscow
        command: ["redis-server", "--appendonly", "yes"]
        volumes:
            - site-redis-data:/data
        networks:
            - default
        # ⬇️ FIX: Добавлен healthcheck
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 10
            start_period: 5s

    scheduler:
        image: ghcr.io/pavelsur07/site-php-cli:${IMAGE_TAG:-latest}
        container_name: scheduler
        logging: *default-logging
        user: root
        entrypoint: ["/usr/local/bin/supercronic"]
        # supercronic v0.2.31 может логировать "waitid: no child processes"
        # из-за race между встроенным reaper и основным wait-loop.
        # Отключаем reaper, т.к. scheduler запускает только короткие php-команды
        # и не нуждается в отдельной "подборке" orphan-процессов.
        command: ["-no-reap", "-json", "/etc/crontabs/app.cron"]
        environment:
            TZ: Europe/Moscow
            DATABASE_URL: pgsql://app:${POSTGRES_PASSWORD}@site-postgres:5432/app
            APP_ENV: prod
            APP_DEBUG: 0
            APP_SECRET: ${APP_SECRET}
            REDIS_DSN: redis://site-redis:6379
            MESSENGER_TRANSPORT_DSN: redis://site-redis:6379/messages
            MESSENGER_TRANSPORT_DSN_SYNC: redis://site-redis:6379/messages_sync
            MESSENGER_TRANSPORT_DSN_PIPELINE: redis://site-redis:6379/messages_pipeline
            MESSENGER_TRANSPORT_DSN_ADS: redis://site-redis:6379/messages_ads
            MESSENGER_TRANSPORT_DSN_WB_FINANCE: redis://site-redis:6379/messages_wb_finance
            MAILER_DSN: ${SITE_MAILER_DSN}
            SENTRY_DSN: ${SENTRY_DSN}
            # Релиз для GlitchTip — git sha из деплоя. Пусто = релиз-трекинг выключен (безопасно).
            SENTRY_RELEASE: ${SENTRY_RELEASE:-}
            # Ключ шифрования api_key подключений маркетплейсов (чтение encrypted-строк cron-командами).
            APP_ENCRYPTION_FALLBACK_KEY: ${APP_ENCRYPTION_FALLBACK_KEY:-}
            APP_ENCRYPTION_KEYS_JSON: ${APP_ENCRYPTION_KEYS_JSON:-}
            APP_ENCRYPTION_CURRENT_KEY_VERSION: ${APP_ENCRYPTION_CURRENT_KEY_VERSION:-v1}
            # BankSync, Альфа: канал mTLS и вход Alfa ID песочницы (docs/tasks/bank-sync/alfa-demo.md).
            # Пусто = Альфа не настроена (кнопок входа нет, гейт сертификатов — «не настроено»).
            ALFA_TLS_CERT_PATH: ${ALFA_TLS_CERT_PATH:-}
            ALFA_TLS_KEY_PATH: ${ALFA_TLS_KEY_PATH:-}
            ALFA_TLS_KEY_PASSPHRASE: ${ALFA_TLS_KEY_PASSPHRASE:-}
            ALFA_SANDBOX_CLIENT_ID: ${ALFA_SANDBOX_CLIENT_ID:-}
            ALFA_SANDBOX_CLIENT_SECRET: ${ALFA_SANDBOX_CLIENT_SECRET:-}
            ALFA_SANDBOX_ID_SIGNING_CERT_PATH: ${ALFA_SANDBOX_ID_SIGNING_CERT_PATH:-}
            # Heartbeat-монитор GlitchTip (dead man's switch для supercronic).
            # Пусто = мониторинг молчания scheduler выключен.
            GLITCHTIP_SCHEDULER_HEARTBEAT_URL: ${GLITCHTIP_SCHEDULER_HEARTBEAT_URL:-}
            # Витрина покрытия ozon-fetcher (cron app:service-gateway:coverage:refresh).
            # Только здесь: страница читает витрину, сервис зовёт одна cron-команда.
            # Пустой токен — обновление выключено (exit 0).
            OZON_FETCHER_BASE_URL: http://ozon-fetcher:8080
            OZON_FETCHER_API_TOKEN: ${OZON_FETCHER_API_TOKEN:-}
            APP_MAIL_FROM: "Ваш Финдир <support@vashfindir.ru>"
            APP_MAIL_REPLY_TO: "support@vashfindir.ru"
            FEATURE_FUNDS_AND_WIDGET: ${FEATURE_FUNDS_AND_WIDGET:-1}
            WB_LEGACY_RECONCILE_ENABLED: ${WB_LEGACY_RECONCILE_ENABLED:-0}
            # Нужно для app:telegram:send-reports (исходящие в Telegram через шлюз)
            TELEGRAM_API_BASE_URL: ${TELEGRAM_API_BASE_URL:-https://tg.vashfindir.ru/bot-api}
            # ─── Объектное хранилище (timeweb S3) — cron-команды тоже читают/пишут файлы ───
            APP_OBJECT_STORAGE_DRIVER: s3
            APP_OBJECT_STORAGE_S3_ENDPOINT: "https://s3.twcstorage.ru"
            APP_OBJECT_STORAGE_S3_BUCKET: "ccd24eb8-1c82-4de4-bd69-9706a7b5443b"
            APP_OBJECT_STORAGE_S3_REGION: "ru-1"
            APP_OBJECT_STORAGE_S3_PATH_STYLE_ENDPOINT: "0"
            APP_OBJECT_STORAGE_S3_ACCESS_KEY: ${APP_OBJECT_STORAGE_S3_ACCESS_KEY:-}
            APP_OBJECT_STORAGE_S3_SECRET_KEY: ${APP_OBJECT_STORAGE_S3_SECRET_KEY:-}
        volumes:
            # Сертификаты канала и подписи Альфы (BankSync) — вне образа и git, только чтение.
            # Каталог на хосте — ${SERVER_DIR}/shared/alfa, его создаёт деплой (пустой = Альфа не настроена).
            - ${ALFA_SECRETS_DIR:-./alfa-secrets}:/app/var/secrets/alfa:ro
            - ./docker/cron/app.cron:/etc/crontabs/app.cron:ro
            - site_storage:/app/var/storage
        depends_on:
            site-postgres:
                condition: service_healthy
            site-redis:
                condition: service_healthy
        restart: unless-stopped
        # Последний PHP-сервис, остававшийся без cgroup-лимита вовсе.
        #
        # 3G — не замер, а осознанно щедрая оценка сверху по составу расписания:
        # фон из 4–8 одновременных процессов (четыре ежеминутные ads-задачи плюс
        # 2/5/10/30-минутные, совпадающие на минуте :00 каждого получаса) и до ~2G
        # от app:ingestion:ozon-accrual:daily-maintenance — она порождает подпроцесс,
        # который стартует как новый php, читает php.ini (1024M) и родительский
        # `-d memory_limit=1G` не наследует.
        #
        # Задача лимита здесь не экономить память, а перевести отказ из host-wide OOM
        # (ядро выбирает жертву само и может убить посторонний сервис) в
        # container-scoped, и включить счётчики memory.events, которых без лимита нет.
        # Слишком тесный лимит был бы опаснее отсутствующего: supercronic схлопывает
        # все отказы cron в один issue GlitchTip, поэтому регулярный OOM-килл отдельной
        # команды был бы тихим.
        #
        # Уточнение числа — по `cat /sys/fs/cgroup/memory.peak` внутри контейнера после
        # полного цикла, включая месячную задачу `0 6 5 * *`.
        # См. docs/tasks/scheduler-cgroup-limit/task.md.
        deploy:
            resources:
                limits:
                    memory: 3G
                reservations:
                    memory: 256M

    # Загрузка финансовых данных Ozon (services/ozon-fetcher). Профиль: контейнер
    # не стартует, пока деплой не включит его переменной OZON_FETCHER_ENABLED=true
    # (`up -d --remove-orphans` поднимает все сервисы без профиля).
    # Без ingress: только сеть default. См. docs/maintenance/ozon-fetcher-prod.md.
    ozon-fetcher:
        image: ghcr.io/pavelsur07/ozon-fetcher:${IMAGE_TAG:-latest}
        container_name: ozon-fetcher
        profiles: ["ozon-fetcher"]
        restart: always
        logging: *default-logging
        environment:
            TZ: Europe/Moscow
            LISTEN_ADDR: ":8080"
            # Общий инстанс PostgreSQL в той же docker-сети, без SSL — как у Symfony.
            DB_DSN: postgres://svc_ozon_fetcher:${OZON_FETCHER_DB_PASSWORD:-}@site-postgres:5432/ozon_fetcher?sslmode=disable
            SYMFONY_INTERNAL_BASE_URL: http://site-nginx
            INTERNAL_AUTH_TOKEN: ${INTERNAL_AUTH_TOKEN:-}
            # Токен направления «Symfony → сервис» для /internal/* сервиса (service-gateway.md §2.9).
            # Пусто — /internal/* сервиса закрыт.
            SERVICE_API_TOKEN: ${OZON_FETCHER_API_TOKEN:-}
            CONNECTIONS_POLL_INTERVAL: 5m
            MAX_PARALLEL_CONNECTIONS: "2"
            CONNECTION_ALLOWLIST: ${OZON_FETCHER_CONNECTION_ALLOWLIST:-}
            # Ошибки (ERROR) — в свой проект GlitchTip (секрет OZON_FETCHER_SENTRY_DSN; пусто — только лог).
            SENTRY_DSN: ${OZON_FETCHER_SENTRY_DSN:-}
            SENTRY_RELEASE: ${SENTRY_RELEASE:-}
            SENTRY_ENVIRONMENT: prod
            S3_ENDPOINT: "https://s3.twcstorage.ru"
            S3_REGION: "ru-1"
            S3_BUCKET: "vashfindir-services-raw"
            S3_ACCESS_KEY_ID: ${OZON_FETCHER_S3_ACCESS_KEY_ID:-}
            S3_SECRET_ACCESS_KEY: ${OZON_FETCHER_S3_SECRET_ACCESS_KEY:-}
        networks:
            - default
        depends_on:
            site-postgres:
                condition: service_healthy
        stop_grace_period: 30s
        healthcheck:
            test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 10s
        deploy:
            resources:
                limits:
                    memory: 384M
                reservations:
                    memory: 64M

volumes:
    site_storage:
    site_company_storage:
    site_var_log:
    traefik-certs:
    postgres_data:
    site-redis-data:

networks:
    traefik-public:
        external: true
    default:
        driver: bridge
