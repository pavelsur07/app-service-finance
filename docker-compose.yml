# ───────────────────────────────────────────────────────────────
# Общий блок переменных окружения (DRY) — московское время
# ───────────────────────────────────────────────────────────────
x-tz-env: &tz-env
    TZ: Europe/Moscow

# container_name не задаётся: compose называет контейнеры <проект>-<сервис>-N
# (app-service-finance-site-postgres-1), и на машине с другими стеками они не
# путаются. Сервисы находят друг друга по имени сервиса (site-postgres,
# site-redis) внутри сети проекта. Прод — docker-compose.prod.yml, там свои имена.
services:
    traefik:
        image: traefik:3.3
        environment:
            <<: *tz-env
        command:
            --providers.docker=true
            --providers.docker.exposedByDefault=false
            --entryPoints.http.address=:80
        ports:
            - "80:80"
            - "8080:8080"
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock:ro
        labels:
            - traefik.enable=true
            - traefik.docker.network=traefik-public
        networks:
            - traefik-public
    land:
        image: nginx:1.27-alpine
        restart: unless-stopped
        environment:
            <<: *tz-env
        volumes:
          - ./landing/public:/usr/share/nginx/html:ro
          - ./landing/nginx/conf.d:/etc/nginx/conf.d:ro
        networks:
          - traefik-public
        labels:
          - traefik.enable=true
          - traefik.docker.network=traefik-public

          # Traefik router → land.localhost
          - traefik.http.routers.land.rule=Host(`land.localhost`)
          - traefik.http.routers.land.entryPoints=http
          - traefik.http.routers.land.service=land
          - traefik.http.services.land.loadbalancer.server.port=80
    site:
        build:
            context: site/docker
            dockerfile: development/nginx/Dockerfile
        environment:
            <<: *tz-env
        volumes:
            - ./site:/app
            - ./landing:/app/landing   # ← добавили
        networks:
            - traefik-public
            - default
        labels:
            - traefik.enable=true
            - traefik.docker.network=traefik-public
            - traefik.http.routers.site.rule=Host(`localhost`)
            - traefik.http.routers.site.entryPoints=http
            - traefik.http.services.site.loadBalancer.server.port=80
    site-php-fpm:
        build:
            context: site/docker
            dockerfile: development/php-fpm/Dockerfile
        environment:
            <<: *tz-env
        depends_on:
            site-postgres:
                condition: service_healthy
            site-redis:
                condition: service_healthy
        volumes:
          - ./site:/app
    site-php-cli:
        build:
            context: site/docker
            dockerfile: development/php-cli/Dockerfile
        working_dir: /app
        environment:
            <<: *tz-env
        volumes:
            - ./site:/app
        command: php bin/console
    site-frontend:
        image: node:24-alpine
        working_dir: /app
        environment:
            <<: *tz-env
        volumes:
            - ./site:/app
        ports:
            - "5173:5173" # <-- ДОБАВИТЬ ЭТО (проброс порта Vite)
        command: sh -c "yarn install && yarn dev"
    site-php-cli-worker-sync:
        build:
            context: site/docker
            dockerfile: development/php-cli/Dockerfile
        working_dir: /app
        restart: unless-stopped
        environment:
            <<: *tz-env
        depends_on:
            site-postgres:
                condition: service_healthy
            site-redis:
                condition: service_healthy
        volumes:
            - ./site:/app
        command: php bin/console messenger:consume async_sync --time-limit=3600 --memory-limit=160M -vv

    site-php-cli-worker-pipeline:
        build:
            context: site/docker
            dockerfile: development/php-cli/Dockerfile
        working_dir: /app
        restart: unless-stopped
        environment:
            <<: *tz-env
        depends_on:
            site-postgres:
                condition: service_healthy
            site-redis:
                condition: service_healthy
        volumes:
            - ./site:/app
        command: php bin/console messenger:consume async_pipeline --time-limit=3600 --memory-limit=500M -vv

    site-php-cli-worker-wb-finance:
        build:
            context: site/docker
            dockerfile: development/php-cli/Dockerfile
        working_dir: /app
        restart: unless-stopped
        environment:
            <<: *tz-env
        depends_on:
            site-postgres:
                condition: service_healthy
            site-redis:
                condition: service_healthy
        volumes:
            - ./site:/app
        command: php bin/console messenger:consume async_wb_finance --time-limit=3600 --memory-limit=256M --sleep=5 --no-interaction

    site-php-cli-worker-ads:
        build:
            context: site/docker
            dockerfile: development/php-cli/Dockerfile
        working_dir: /app
        restart: unless-stopped
        environment:
            <<: *tz-env
        depends_on:
            site-postgres:
                condition: service_healthy
            site-redis:
                condition: service_healthy
        volumes:
            - ./site:/app
        command: php bin/console messenger:consume async_ads --time-limit=3600 --memory-limit=160M -vv

    # ───────────────────────────────────────────────────────────────
    # Сервисы монорепо services/ (Go/Python). Профиль services:
    # обычный up монолита их не собирает и не запускает.
    # Правила: services/AGENTS.md
    # ───────────────────────────────────────────────────────────────
    services-ozon-fetcher:
        build:
            context: services/ozon-fetcher
            dockerfile: docker/Dockerfile
        restart: unless-stopped
        environment:
            <<: *tz-env
            LISTEN_ADDR: ":8080"
        ports:
            - "8180:8080"   # dev-only проброс /health
        profiles:
            - services
        healthcheck:
            test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
            interval: 10s
            timeout: 3s
            retries: 5
            start_period: 5s

    # Тулчейн-контейнеры сервиса (гейты make ozon-fetcher-test/-vet/-lint);
    # не публикуются и не деплоятся. См. services/go.md «Гейты».
    services-ozon-fetcher-dev:
        image: golang:1.27-alpine
        working_dir: /src
        environment:
            <<: *tz-env
        volumes:
            - ./services/ozon-fetcher:/src
        profiles:
            - services

    services-ozon-fetcher-lint:
        image: golangci/golangci-lint:v2.11.4-alpine
        working_dir: /src
        environment:
            <<: *tz-env
        volumes:
            - ./services/ozon-fetcher:/src
        profiles:
            - services

    site-postgres:
        image: postgres:15-alpine
        restart: always
        # ponytail: fsync/synchronous_commit/full_page_writes выключены — это
        # локальный dev/test-инстанс в docker volume, не прод (см. docker-compose.prod.yml).
        # Ускоряет TRUNCATE/COMMIT в интеграционных тестах; при грубом сбое хоста БД можно
        # пересоздать миграциями+фикстурами, поэтому durability здесь не критична.
        command: postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off
        environment:
            <<: *tz-env
            POSTGRES_DB: app
            POSTGRES_USER: app
            POSTGRES_PASSWORD: secret
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U app -d app"]
            interval: 5s
            timeout: 3s
            retries: 10
            start_period: 5s
    site-redis:
        image: redis:7-alpine
        restart: unless-stopped
        environment:
            <<: *tz-env
        command: [ "redis-server", "--appendonly", "yes" ]
        volumes:
          - site-redis-data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 10
            start_period: 5s
    site-mailer:
        image: mailhog/mailhog
        environment:
            <<: *tz-env
        networks:
            - traefik-public
            - default
        labels:
            - traefik.enable=true
            - traefik.docker.network=traefik-public
            - traefik.http.routers.mailer.rule=Host(`mailer.localhost`)
            - traefik.http.routers.mailer.entryPoints=http
            - traefik.http.services.mailer.loadBalancer.server.port=8025
volumes:
    postgres_data:
    site-redis-data:
networks:
    traefik-public:
        name: traefik-public
        driver: bridge
