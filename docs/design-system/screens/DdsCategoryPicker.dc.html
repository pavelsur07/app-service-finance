<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Виджет · Статья ДДС</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
:root{--primary:#1d4ed8;--bg:#f7f8fc;--surface:#ffffff;--text:#0b1020;--muted:#525b78;--border:#dde1ec;--border-strong:#c3c8d6;--head-bg:#f4f6fb;--danger:#9a001b}
body{margin:0;background:#fff}
*{box-sizing:border-box}
button,input{font-family:inherit;font-size:14px;color:var(--text)}
.wrap{display:flex;align-items:stretch;height:36px;border:1px solid var(--border-strong);border-radius:4px;background:var(--surface)}
.wrap:hover{background:#fbfcfe}
.main{flex:1;min-width:0;display:flex;align-items:center;gap:8px;padding:0 10px 0 12px;border:0;background:none;text-align:left;cursor:pointer;border-radius:4px}
.x{flex:none;width:34px;border:0;border-left:1px solid var(--border);background:none;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;border-radius:0 3px 3px 0}
.x:hover{background:rgba(11,16,32,.07);color:var(--text)}
.row{display:flex;align-items:center;gap:8px;width:100%;min-height:34px;border:0;background:none;text-align:left;cursor:pointer;font-size:14px;line-height:20px}
.row:hover{background:var(--head-bg)}
.grp:hover{background:#f4f6fb !important}
.grp[data-d="1"]{padding-left:34px;font-weight:600;background-image:linear-gradient(#aab1c4,#aab1c4);background-size:1px 100%;background-position:19px 0;background-repeat:no-repeat}
.grp[data-d="2"]{padding-left:56px;font-weight:600;background-image:linear-gradient(#aab1c4,#aab1c4),linear-gradient(#aab1c4,#aab1c4);background-size:1px 100%,1px 100%;background-position:19px 0,41px 0;background-repeat:no-repeat}
.grp[data-d="3"]{padding-left:78px;font-weight:600;background-image:linear-gradient(#aab1c4,#aab1c4),linear-gradient(#aab1c4,#aab1c4),linear-gradient(#aab1c4,#aab1c4);background-size:1px 100%,1px 100%,1px 100%;background-position:19px 0,41px 0,63px 0;background-repeat:no-repeat}
.grp[data-d="4"]{padding-left:100px;font-weight:600;background-image:linear-gradient(#aab1c4,#aab1c4),linear-gradient(#aab1c4,#aab1c4),linear-gradient(#aab1c4,#aab1c4),linear-gradient(#aab1c4,#aab1c4);background-size:1px 100%,1px 100%,1px 100%,1px 100%;background-position:19px 0,41px 0,63px 0,85px 0;background-repeat:no-repeat}
.leaf[data-d="1"]{padding-left:58px;background-image:linear-gradient(#aab1c4,#aab1c4);background-size:1px 100%;background-position:19px 0;background-repeat:no-repeat}
.leaf[data-d="2"]{padding-left:80px;background-image:linear-gradient(#aab1c4,#aab1c4),linear-gradient(#aab1c4,#aab1c4);background-size:1px 100%,1px 100%;background-position:19px 0,41px 0;background-repeat:no-repeat}
.leaf[data-d="3"]{padding-left:102px;background-image:linear-gradient(#aab1c4,#aab1c4),linear-gradient(#aab1c4,#aab1c4),linear-gradient(#aab1c4,#aab1c4);background-size:1px 100%,1px 100%,1px 100%;background-position:19px 0,41px 0,63px 0;background-repeat:no-repeat}
.leaf[data-d="4"]{padding-left:124px;background-image:linear-gradient(#aab1c4,#aab1c4),linear-gradient(#aab1c4,#aab1c4),linear-gradient(#aab1c4,#aab1c4),linear-gradient(#aab1c4,#aab1c4);background-size:1px 100%,1px 100%,1px 100%,1px 100%;background-position:19px 0,41px 0,63px 0,85px 0;background-repeat:no-repeat}
.leaf[data-d="5"]{padding-left:146px;background-image:linear-gradient(#aab1c4,#aab1c4),linear-gradient(#aab1c4,#aab1c4),linear-gradient(#aab1c4,#aab1c4),linear-gradient(#aab1c4,#aab1c4),linear-gradient(#aab1c4,#aab1c4);background-size:1px 100%,1px 100%,1px 100%,1px 100%,1px 100%;background-position:19px 0,41px 0,63px 0,85px 0,107px 0;background-repeat:no-repeat}
.grp{font-weight:700;padding-left:12px}
.grp[data-d="0"]{margin-top:4px}
.leaf[aria-selected=true]{background-color:#eef3fd;font-weight:600}
.leaf[data-cur=true]{background-color:#e8effd}
.oi[aria-selected=true]{background:#f4f6fb}
.oi[data-cur=true]{background:#e8effd}
.leg{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.lnk{background:none;border:0;padding:0;color:var(--primary);cursor:pointer;font-weight:500;font-size:13px}
.lnk:hover{text-decoration:underline}
button:focus-visible,input:focus-visible{outline:2px solid var(--primary);outline-offset:-2px}
.wrap:has(.main:focus-visible){outline:2px solid var(--primary);outline-offset:2px}
.main:focus-visible{outline:none}
</style>
</helmet>

<div style="position:relative;min-height:100%;padding:24px;background:#fff;font-family:'Inter',system-ui,sans-serif;font-size:14px;line-height:20px;color:var(--text)">
  <div style="font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:8px">Статья ДДС</div>

  <div style="position:relative">
    <div class="wrap" style="{{wrapStyle}}">
      <button class="main" type="button" aria-haspopup="dialog" aria-expanded="{{open}}" onClick="{{toggle}}">
        <span style="{{labelStyle}};overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{label}}</span>
        <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;color:var(--muted)">{{path}}</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <sc-if value="{{canClear}}" hint-placeholder-val="{{ false }}"><button class="x" type="button" aria-label="Очистить статью" onClick="{{clear}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></sc-if>
    </div>

    <sc-if value="{{open}}" hint-placeholder-val="{{ false }}">
      <sc-if value="{{overlay}}" hint-placeholder-val="{{ false }}"><div onClick="{{close}}" aria-hidden="true" style="position:fixed;inset:0;z-index:25"></div></sc-if>
      <div role="dialog" aria-label="Выбор статьи ДДС" style="{{popStyle}};min-width:320px;z-index:30;background:var(--surface);border:1px solid var(--border);border-radius:4px;box-shadow:0 8px 24px rgba(11,16,32,.14)">
        <div style="padding:12px;border-bottom:1px solid var(--border)">
          <div style="position:relative">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="1.8" stroke-linecap="round" aria-hidden="true" style="position:absolute;left:12px;top:10px"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
            <input id="{{sid}}" type="search" aria-label="Поиск статьи по названию" placeholder="Найти статью" autocomplete="off" value="{{q}}" onInput="{{onQ}}" onKeyDown="{{onKey}}" style="width:100%;height:36px;padding:0 12px 0 36px;border:1px solid var(--border-strong);border-radius:4px;background:var(--surface)">
          </div>
          <div style="margin-top:8px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;font-size:12px;color:var(--muted)">
            <span><sc-if value="{{hasDir}}" hint-placeholder-val="{{ true }}"><span>{{dirNote}} <button class="lnk" type="button" onClick="{{toggleAll}}" style="font-size:12px">{{dirAction}}</button></span></sc-if></span>
            <span><button class="lnk" type="button" onClick="{{expandAll}}" style="font-size:12px">Развернуть всё</button> · <button class="lnk" type="button" onClick="{{collapseAll}}" style="font-size:12px">Свернуть всё</button></span>
          </div>
        </div>
        <div role="tree" aria-label="Статьи ДДС" style="max-height:{{treeMax}}px;overflow-y:auto;padding:4px 0">
          <sc-for list="{{rows}}" as="r" hint-placeholder-count="8">
            <sc-if value="{{r.isLabel}}" hint-placeholder-val="{{ false }}"><div style="padding:8px 16px 4px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)">{{r.name}}</div></sc-if>
            <sc-if value="{{r.isGroup}}" hint-placeholder-val="{{ false }}">
              <button class="row grp" type="button" role="treeitem" aria-expanded="{{r.open}}" onClick="{{r.toggle}}" data-d="{{r.depth}}" style="color:var(--text);font-size:13px">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none;{{r.chev}}"><path d="M9 6l6 6-6 6"/></svg>
                <span style="flex:1;min-width:0">{{r.name}}</span><span style="flex:none;margin-right:16px;min-width:20px;padding:0 6px;border-radius:10px;background:#e3e7f1;text-align:center;font-weight:600;font-size:12px;color:var(--muted)">{{r.count}}</span>
              </button>
            </sc-if>
            <sc-if value="{{r.isItem}}" hint-placeholder-val="{{ true }}">
              <button class="row leaf" type="button" role="treeitem" aria-selected="{{r.sel}}" data-cur="{{r.cur}}" data-d="{{r.depth}}" onClick="{{r.pick}}">
                <span style="flex:1;min-width:0"><span>{{r.pre}}</span><span style="font-weight:700;background:#fff1b8">{{r.hit}}</span><span>{{r.post}}</span></span>
                <span style="flex:none;font-size:12px;color:var(--muted)">{{r.tag}}</span>
                <span style="flex:none;width:28px;display:inline-flex;justify-content:center;color:var(--primary)">{{r.check}}</span>
              </button>
            </sc-if>
          </sc-for>
          <sc-if value="{{empty}}" hint-placeholder-val="{{ false }}"><div style="padding:24px 16px;text-align:center;color:var(--muted)">Статья не найдена. Проверьте название{{emptyHint}}</div></sc-if>
        </div>
        <div style="display:flex;justify-content:space-between;gap:12px;padding:8px 16px;border-top:1px solid var(--border);background:var(--head-bg);font-size:12px;color:var(--muted);border-radius:0 0 4px 4px"><span>↑ ↓ — выбрать · Enter — подтвердить</span><span>Esc — закрыть</span></div>
      </div>
    </sc-if>
  </div>

  <sc-if value="{{demo}}" hint-placeholder-val="{{ true }}">
    <div style="margin-top:16px;padding:12px 14px;border:1px solid var(--border);border-radius:4px;background:var(--head-bg);display:flex;flex-direction:column;gap:8px">
      <div class="leg"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><path d="M9 6l6 6-6 6"/></svg><span><b style="color:var(--text)">Группа</b> — только раскрывается и сворачивается. Выбрать её нельзя.</span></div>
      <div class="leg"><span aria-hidden="true" style="flex:none;width:14px;text-align:center;color:var(--primary)">✓</span><span><b style="color:var(--text)">Статья</b> — конечный узел (лист). Выбирается одним кликом или Enter.</span></div>
      <div style="padding-top:8px;border-top:1px solid var(--border);font-size:13px"><span style="color:var(--muted)">Выбрано:</span> <b>{{label}}</b> <span style="color:var(--muted)">{{path}}</span></div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"value":{"editor":"text","default":"subs-ai"},"direction":{"editor":"enum","default":"","options":["","in","out"]},"recent":{"editor":null},"invalid":{"editor":"boolean","default":false},"clearable":{"editor":"boolean","default":true},"onPick":{"editor":null},"demo":{"editor":"boolean","default":true},"$preview":{"width":560,"height":900}}'>
const TREE = [
  { id: 'g-in', name: 'Поступления', children: [
    { id: 'rev-other', name: 'Выручка — Прочие', flow: 'in' },
    { id: 'rev-shop', name: 'Выручка — Интернет-магазин', flow: 'in' },
    { id: 'rev-showroom', name: 'Выручка — Шоурум', flow: 'in' },
    { id: 'rev-mp', name: 'Выручка — Маркетплейсы', flow: 'in' }
  ] },
  { id: 'g-out', name: 'Выбытие', children: [
    { id: 'fee', name: 'Комиссия банка', flow: 'out' },
    { id: 'subs-ai', name: 'Подписки ИИ', flow: 'out' },
    { id: 'subs-svc', name: 'Подписки на сервисы', flow: 'out' },
    { id: 'tax', name: 'Налоги (ЕНП, не ФОТ)', flow: 'out' },
    { id: 'mkt', name: 'Маркетинг — подрядчики', flow: 'out' },
    { id: 'host', name: 'Услуги хостинга', flow: 'out' },
    { id: 'g-pay', name: 'Заработная плата', children: [
      { id: 'pay-dir', name: 'Директор', flow: 'out' },
      { id: 'g-prod', name: 'Производство', children: [
        { id: 'g-c1', name: 'Цех №1', children: [
          { id: 'pay-c1-w', name: 'Сварщики', flow: 'out' },
          { id: 'pay-c1-m', name: 'Монтажники', flow: 'out' }
        ] },
        { id: 'g-c2', name: 'Цех №2', children: [
          { id: 'pay-c2-w', name: 'Станочники', flow: 'out' },
          { id: 'pay-c2-p', name: 'Маляры', flow: 'out' }
        ] }
      ] }
    ] }
  ] },
  { id: 'g-fin', name: 'Финансовая деятельность', children: [
    { id: 'loan-in', name: 'Получение кредитов', flow: 'in' },
    { id: 'loan-out', name: 'Погашение кредитов', flow: 'out' },
    { id: 'int-paid', name: 'Проценты уплаченные', flow: 'out' }
  ] },
  { id: 'g-inv', name: 'Инвестиционная деятельность', children: [
    { id: 'dep-out', name: 'Размещение средств на депозитах', flow: 'out' },
    { id: 'dep-in', name: 'Возврат средств с депозитов', flow: 'in' },
    { id: 'int-got', name: 'Проценты полученные', flow: 'in' }
  ] },
  { id: 'g-tech', name: 'Технические операции', children: [
    { id: 'tech-in', name: 'Поступления', flow: 'in' },
    { id: 'tech-out', name: 'Выбытия', flow: 'out' },
    { id: 'undist', name: 'Не распределено', flow: 'both' }
  ] }
];
function find(nodes, id, path) {
  for (const n of nodes) {
    if (n.children) { const r = find(n.children, id, (path ? path + ' › ' : '') + n.name); if (r) return r; }
    else if (n.id === id) return { node: n, path: path || '' };
  }
  return null;
}
const FLOW = { in: 'Приток', out: 'Отток', both: '' };

class Component extends DCLogic {
  state = { open: true, q: '', cursor: -1, collapsed: {}, showAll: false, val: undefined };

  componentDidUpdate(prevProps, prevState) {
    if (!prevState.open && this.state.open && typeof document !== 'undefined') {
      setTimeout(() => { const el = document.getElementById(this._sid); if (el) el.focus(); }, 0);
    }
  }

  renderVals() {
    const s = this.state, pr = this.props;
    this._sid = this._sid || 'dcp-' + Math.random().toString(36).slice(2, 8);
    const controlled = typeof pr.onPick === 'function';
    const value = controlled ? (pr.value || '') : (s.val !== undefined ? s.val : (pr.value ?? 'subs-ai'));
    const demo = (pr.demo ?? true) && !controlled;
    const dir = pr.direction ?? '';
    const cur = value ? find(TREE, value, '') : null;
    const q = s.q.trim().toLowerCase();
    const flowOk = (n) => s.showAll || !dir || n.flow === 'both' || n.flow === dir;
    const matchAt = (name) => (q ? name.toLowerCase().indexOf(q) : -1);
    const leaves = [];

    const build = (nodes, depth, force) => {
      const out = []; let count = 0;
      nodes.forEach((n) => {
        if (n.children) {
          const sub = build(n.children, depth + 1, force || matchAt(n.name) >= 0);
          if (sub.count === 0) return;
          const open = q ? true : !s.collapsed[n.id];
          out.push({ isGroup: true, isItem: false, isLabel: false, depth, id: n.id, name: n.name, count: sub.count, open, pad: 'padding-left:' + (16 + depth * 16) + 'px', chev: open ? 'transform:rotate(90deg)' : '', toggle: () => this.setState((x) => ({ collapsed: Object.assign({}, x.collapsed, { [n.id]: !x.collapsed[n.id] }) })) });
          if (open) sub.rows.forEach((r) => out.push(r));
          count += sub.count;
        } else {
          if (!flowOk(n)) return;
          const at = matchAt(n.name);
          if (q && !force && at < 0) return;
          count += 1;
          out.push({ isItem: true, isGroup: false, isLabel: false, id: n.id, node: n, depth, at });
        }
      });
      return { rows: out, count };
    };

    const top = [];
    if (!q && Array.isArray(pr.recent) && pr.recent.length) {
      const rec = pr.recent.map((id) => find(TREE, id, '')).filter((x) => x && flowOk(x.node));
      if (rec.length) { top.push({ isLabel: true, isGroup: false, isItem: false, name: 'Недавние' }); rec.forEach((x) => top.push({ isItem: true, isGroup: false, isLabel: false, id: x.node.id, node: x.node, depth: -1, at: -1 })); }
    }
    const tree = build(TREE, 0, false);
    const all = top.concat(tree.rows);
    all.forEach((r) => { if (r.isItem) leaves.push(r); });
    const cursor = s.cursor >= 0 ? Math.min(s.cursor, leaves.length - 1) : (q && leaves.length ? 0 : -1);

    const pick = (id) => {
      const f = find(TREE, id, '');
      this.setState({ open: demo, q: '', cursor: -1, val: id });
      if (controlled) pr.onPick(id, f ? { id, name: f.node.name, flow: f.node.flow, path: f.path } : null);
    };
    const rows = all.map((r) => {
      if (!r.isItem) return r;
      const n = r.node, i = leaves.indexOf(r), isSel = n.id === value;
      const name = n.name, at = r.at;
      return {
        isItem: true, isGroup: false, isLabel: false, depth: r.depth,
        cur: i === cursor,
        pre: at >= 0 ? name.slice(0, at) : name, hit: at >= 0 ? name.slice(at, at + q.length) : '', post: at >= 0 ? name.slice(at + q.length) : '',
        tag: (!dir || s.showAll) ? FLOW[n.flow] : '', sel: isSel,
        check: isSel ? '✓' : '',
        pick: () => pick(n.id)
      };
    });

    const hasDir = !!dir;
    return {
      accent: pr.accent ?? '#1d4ed8', rowPy: 12,
      sid: this._sid,
      demo, overlay: s.open && !demo, treeMax: demo ? 520 : 340,
      popStyle: demo ? 'position:relative;margin-top:4px' : 'position:absolute;top:calc(100% + 4px);left:0;right:0',
      expandAll: () => this.setState({ collapsed: {} }),
      collapseAll: () => this.setState({ collapsed: { 'g-in': true, 'g-out': true, 'g-fin': true, 'g-inv': true, 'g-tech': true, 'g-pay': true, 'g-prod': true, 'g-c1': true, 'g-c2': true } }),
      open: s.open, q: s.q, rows, empty: leaves.length === 0,
      emptyHint: hasDir && !s.showAll ? ' или покажите все статьи.' : '.',
      hasDir, dirNote: s.showAll ? 'Показаны все статьи.' : 'Статьи для ' + (dir === 'in' ? 'притока.' : 'оттока.'), dirAction: s.showAll ? 'Только подходящие' : 'Показать все',
      toggleAll: () => this.setState((x) => ({ showAll: !x.showAll })),
      label: cur ? cur.node.name : 'Не выбрана', labelStyle: 'flex:none;max-width:70%;' + (cur ? 'font-weight:500' : 'color:var(--muted)'),
      path: cur ? cur.path : '',
      wrapStyle: pr.invalid ? 'border-color:var(--danger);box-shadow:inset 0 0 0 1px var(--danger)' : '',
      canClear: !!cur && pr.clearable !== false,
      toggle: () => this.setState((x) => ({ open: !x.open, q: '', cursor: -1 })),
      close: () => this.setState({ open: false, q: '', cursor: -1 }),
      clear: () => { this.setState({ val: '' }); if (controlled) pr.onPick('', null); },
      onQ: (e) => this.setState({ q: e.target.value, cursor: -1 }),
      onKey: (e) => {
        const n = leaves.length;
        if (e.key === 'ArrowDown') { e.preventDefault(); this.setState({ cursor: n ? (cursor + 1) % n : -1 }); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); this.setState({ cursor: n ? (cursor <= 0 ? n - 1 : cursor - 1) : -1 }); }
        else if (e.key === 'Enter') { e.preventDefault(); const t = leaves[cursor >= 0 ? cursor : 0]; if (t && (cursor >= 0 || q)) pick(t.id); }
        else if (e.key === 'Escape') { e.preventDefault(); this.setState({ open: false, q: '', cursor: -1 }); }
      }
    };
  }
}
</script>
</body>
</html>
